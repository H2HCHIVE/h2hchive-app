<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초동 판매량 | H2HCHIVE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f6f8;
    color: #222;
}

.container {
    max-width: 420px;
    margin: 0 auto;
    padding: 24px 16px calc(90px + env(safe-area-inset-bottom, 0px));
}

.back-btn {
    display: inline-block;
    text-decoration: none;
    color: #222;
    font-size: 1.5rem;
    margin-bottom: 20px;
    line-height: 1;
}

.page-title {
    font-size: 2rem;
    font-weight: 700;
    margin: 0 0 24px;
}

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.section-heading h2 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 700;
}

.section-heading span {
    font-size: .8rem;
    color: #888;
}

.album-list {
    display: flex;
    flex-direction: column;
}

.album-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid #ddd;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.album-card:active {
    opacity: .65;
}

.album-cover {
    width: 88px;
    height: 88px;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: 12px;
    background: #e8eaf0;
}

.album-info {
    min-width: 0;
    flex: 1;
}

.album-name {
    margin: 0 0 6px;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.4;
    overflow-wrap: anywhere;
}

.album-date {
    margin: 0 0 10px;
    font-size: .82rem;
    color: #888;
}

.album-label {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 7px;
    background: #e6f5fc;
    color: #347da0;
    font-size: .75rem;
    font-weight: 700;
}

/* 앨범 상세 화면 */

#detailView {
    display: none;
}

.detail-album {
    text-align: center;
}

.detail-cover {
    display: block;
    width: 100%;
    max-width: 320px;
    aspect-ratio: 1 / 1;
    margin: 0 auto 24px;
    object-fit: cover;
    border-radius: 18px;
    background: #e8eaf0;
}

.detail-album-title {
    margin: 0 0 8px;
    font-size: 1.5rem;
    font-weight: 800;
    line-height: 1.4;
    overflow-wrap: anywhere;
}

.detail-release-date {
    margin: 0 0 24px;
    color: #888;
    font-size: .9rem;
}

.detail-record {
    padding: 20px 16px;
    background: #fff;
    border-radius: 16px;
    text-align: left;
}

.detail-record-label {
    margin: 0;
    font-size: .9rem;
    font-weight: 700;
    color: #555;
}

/* 하단 메뉴 */

.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 9000;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    background: rgba(255, 255, 255, .97);
    border-top: 1px solid #e8e8e8;
    box-shadow: 0 -3px 14px rgba(0, 0, 0, .06);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.bottom-nav a {
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 42px;
    padding: 0 2px;
    color: #777;
    text-decoration: none;
    font-size: .75rem;
    font-weight: 600;
    white-space: nowrap;
}

.bottom-nav a.active {
    color: #222;
    font-weight: 800;
    position: relative;
}

.bottom-nav a.active::before {
    content: "";
    position: absolute;
    top: -6px;
    left: 28%;
    right: 28%;
    height: 3px;
    border-radius: 4px;
    background: #89CFF0;
}

@media (max-width: 360px) {
    .bottom-nav a {
        font-size: .68rem;
    }

    .album-cover {
        width: 76px;
        height: 76px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- 앨범 목록 화면 -->
    <section id="listView">

        <a href="archive.html" class="back-btn"
           aria-label="아카이브로 돌아가기">←</a>

        <h1 class="page-title">초동 판매량</h1>

        <div class="section-heading">
            <h2>앨범 목록</h2>
            <span>발매일 기준</span>
        </div>

        <div class="album-list">

            <article class="album-card"
                     role="button"
                     tabindex="0"
                     onclick="showDetail(0)"
                     onkeydown="handleAlbumKey(event, 0)">

                <img
                    src="TheChase-scheduler.jpg"
                    alt="The Chase 앨범"
                    class="album-cover">

                <div class="album-info">
                    <h3 class="album-name">The Chase</h3>
                    <p class="album-date">2025.02.24</p>
                    <span class="album-label">초동 기록</span>
                </div>
            </article>

            <article class="album-card"
                     role="button"
                     tabindex="0"
                     onclick="showDetail(1)"
                     onkeydown="handleAlbumKey(event, 1)">

                <img
                    src="FOCUS-sales.png"
                    alt="FOCUS 앨범"
                    class="album-cover">

                <div class="album-info">
                    <h3 class="album-name">FOCUS</h3>
                    <p class="album-date">2025.10.20</p>
                    <span class="album-label">초동 기록</span>
                </div>
            </article>

            <article class="album-card"
                     role="button"
                     tabindex="0"
                     onclick="showDetail(2)"
                     onkeydown="handleAlbumKey(event, 2)">

                <img
                    src="LemonTang-sales.png"
                    alt="Lemon Tang 앨범"
                    class="album-cover">

                <div class="album-info">
                    <h3 class="album-name">Lemon Tang</h3>
                    <p class="album-date">2026.06.22</p>
                    <span class="album-label">초동 기록</span>
                </div>
            </article>

        </div>
    </section>

    <!-- 앨범 상세 화면 -->
    <section id="detailView">

        <button
            type="button"
            class="back-btn"
            onclick="showList()"
            aria-label="앨범 목록으로 돌아가기"
            style="border:0; background:none; padding:0; cursor:pointer;">
            ←
        </button>

        <!-- 상세 화면에서는 초동 판매량 제목을 표시하지 않음 -->

        <div class="detail-album">

            <img
                id="detailCover"
                class="detail-cover"
                src=""
                alt="">

            <h1 id="detailTitle" class="detail-album-title"></h1>

            <p id="detailDate" class="detail-release-date"></p>

            <div class="detail-record">
                <p class="detail-record-label">초동 기록</p>
            </div>

        </div>
    </section>

</div>

<!-- 하단 메뉴 -->
<nav class="bottom-nav" aria-label="주요 메뉴">
    <a href="stream.html">스밍</a>
    <a href="schedule.html">일정</a>
    <a href="index.html">홈</a>
    <a href="content.html">콘텐츠</a>
    <a href="archive.html" class="active" aria-current="page">아카이브</a>
</nav>

<script>
const albums = [
    {
        title: "The Chase",
        date: "2025.02.24",
        image: "TheChase-scheduler.jpg"
    },
    {
        title: "FOCUS",
        date: "2025.10.20",
        image: "FOCUS-sales.png"
    },
    {
        title: "Lemon Tang",
        date: "2026.06.22",
        image: "LemonTang-sales.png"
    }
];

function showDetail(index) {
    const album = albums[index];

    if (!album) return;

    document.getElementById("detailCover").src = album.image;
    document.getElementById("detailCover").alt = album.title + " 앨범";
    document.getElementById("detailTitle").textContent = album.title;
    document.getElementById("detailDate").textContent = album.date;

    document.getElementById("listView").style.display = "none";
    document.getElementById("detailView").style.display = "block";

    window.scrollTo({ top: 0, behavior: "instant" });
}

function showList() {
    document.getElementById("detailView").style.display = "none";
    document.getElementById("listView").style.display = "block";

    window.scrollTo({ top: 0, behavior: "instant" });
}

function handleAlbumKey(event, index) {
    if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        showDetail(index);
    }
}
</script>

</body>
</html>
