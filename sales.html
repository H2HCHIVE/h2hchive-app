<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>프로모션 스케줄러 | H2HCHIVE</title>

<style>
:root {
    --bg: #f5f6f8;
    --white: #ffffff;
    --text: #22252a;
    --muted: #9298a2;
    --line: #e9edf1;
    --blue: #89CFF0;
    --blue-light: #eaf7fd;
    --radius: 20px;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
}

button {
    font: inherit;
}

button:focus-visible,
a:focus-visible {
    outline: 3px solid var(--blue);
    outline-offset: 3px;
}

/* 페이지 */

.page {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    margin: 0 auto;
    padding-bottom: calc(94px + env(safe-area-inset-bottom, 0px));
}

/* 상단 제목 */

.top-header {
    padding: 24px 16px 0;
}

.back-btn {
    display: inline-block;
    min-height: auto;
    margin: 0 0 20px;
    padding: 0;
    border: 0;
    background: transparent;
    color: #222;
    font-size: 1.5rem;
    font-weight: 400;
    line-height: 1.4;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.page-title {
    margin: 0;
    font-size: 32px;
    line-height: 1.25;
    letter-spacing: -1.4px;
    font-weight: 850;
}

.subtitle {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
    word-break: keep-all;
}

/* 앨범 목록 */

.content {
    padding: 30px 16px 20px;
}

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 0 3px 14px;
}

.section-title {
    margin: 0;
    font-size: 14px;
    font-weight: 800;
}

.section-caption {
    color: #9ba1aa;
    font-size: 11px;
}

/* 2열 앨범 그리드 */

.album-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 13px;
}

.album-card {
    display: flex;
    flex-direction: column;
    width: 100%;
    min-width: 0;
    padding: 9px;
    border: 1px solid rgba(226, 231, 236, .8);
    border-radius: var(--radius);
    background: var(--white);
    color: var(--text);
    text-align: left;
    cursor: pointer;
    transition: transform .16s ease, border-color .16s ease;
    -webkit-tap-highlight-color: transparent;
}

.album-card:active {
    transform: scale(.98);
    border-color: var(--blue);
}

/* 프로모션 이미지 미리보기 */

.album-art-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border-radius: 12px;
    background: #edf1f5;
}

.album-art {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
}

.preview-error {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 10px;
    color: #9298a2;
    font-size: 11px;
    line-height: 1.6;
    text-align: center;
    overflow-wrap: anywhere;
}

.album-info {
    min-width: 0;
    padding: 12px 3px 5px;
}

.album-name {
    margin: 0;
    overflow-wrap: anywhere;
    font-size: 15px;
    line-height: 1.45;
    font-weight: 800;
    letter-spacing: -.4px;
}

.album-date {
    margin: 6px 0 0;
    color: #959ba4;
    font-size: 11px;
    font-weight: 500;
}

/* 앨범 상세 화면 */

#viewer {
    display: none;
}

.detail-header {
    padding: 24px 16px 0;
}

.detail-content {
    padding: 0 16px 24px;
}

.albumTitle {
    margin: 0;
    font-size: 29px;
    font-weight: 850;
    letter-spacing: -1px;
    line-height: 1.3;
    overflow-wrap: anywhere;
}

.detail-subtitle {
    margin-top: 8px;
    color: var(--muted);
    font-size: 12px;
}

.image-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 24px 3px 13px;
}

.image-heading strong {
    font-size: 14px;
}

.imageBox {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.imageBox img {
    display: block;
    width: 100%;
    height: auto;
    min-height: 80px;
    border: 1px solid #e8ecf0;
    border-radius: 17px;
    background: #fff;
}

.image-error {
    padding: 22px 15px;
    border: 1px dashed #d7dfe6;
    border-radius: 15px;
    color: #858c96;
    font-size: 12px;
    line-height: 1.7;
    text-align: center;
    overflow-wrap: anywhere;
}

.image-error strong {
    display: block;
    margin-bottom: 5px;
    color: #525a65;
    font-size: 13px;
}

/* 하단 메뉴 - 초동 판매량 페이지 디자인 적용 */

.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1000;

    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));

    width: 100%;
    margin: 0;
    padding: 7px 5px calc(7px + env(safe-area-inset-bottom, 0px));

    border: 0;
    border-top: 1px solid rgba(229, 233, 238, .9);
    background: rgba(255, 255, 255, .96);
    box-shadow: 0 -4px 18px rgba(0, 0, 0, .035);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
}

.bottom-nav a {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    min-width: 0;
    min-height: 42px;
    padding: 0 2px;

    color: #777;
    text-decoration: none;
    text-align: center;
    font-size: 12px;
    line-height: 1.2;
    font-weight: 600;
    white-space: nowrap;

    -webkit-tap-highlight-color: transparent;
}

.bottom-nav a.active {
    color: #252a30;
    font-weight: 850;
}

.bottom-nav a.active::before {
    content: "";
    position: absolute;
    top: -7px;
    left: 30%;
    right: 30%;
    height: 3px;
    border-radius: 4px;
    background: var(--blue);
}

/* 작은 화면 대응 */

@media (max-width: 360px) {
    .top-header,
    .detail-header {
        padding-right: 14px;
        padding-left: 14px;
    }

    .content,
    .detail-content {
        padding-right: 14px;
        padding-left: 14px;
    }

    .page-title {
        font-size: 29px;
    }

    .album-list {
        gap: 10px;
    }

    .album-card {
        padding: 7px;
    }

    .album-name {
        font-size: 14px;
    }

    .album-date {
        font-size: 10px;
    }

    .bottom-nav {
        padding-right: 3px;
        padding-left: 3px;
    }

    .bottom-nav a {
        font-size: 10px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- 앨범 목록 화면 -->
    <section id="listView" aria-label="프로모션 앨범 목록">

        <header class="top-header">
            <a class="back-btn"
               href="archive.html"
               aria-label="아카이브로 돌아가기">←</a>

            <h1 class="page-title">프로모션 스케줄러</h1>

            <p class="subtitle">
                Hearts2Hearts 앨범별 프로모션 일정을 확인하세요.
            </p>
        </header>

        <main class="content">

            <div class="section-heading">
                <h2 class="section-title">앨범 목록</h2>
                <span class="section-caption">발매일 기준</span>
            </div>

            <div class="album-list" id="albumList"></div>

        </main>

    </section>

    <!-- 앨범 상세 화면 -->
    <section id="viewer" aria-label="앨범 프로모션 상세">

        <header class="detail-header">
            <button
                class="back-btn"
                type="button"
                id="backToList"
                aria-label="앨범 목록으로 돌아가기"
            >←</button>
        </header>

        <main class="detail-content">

            <h2 class="albumTitle" id="detailTitle"></h2>

            <div class="detail-subtitle" id="detailDate"></div>

            <div class="image-heading">
                <strong>프로모션 일정</strong>
            </div>

            <div class="imageBox" id="imageBox"></div>

        </main>

    </section>

</div>

<!-- 하단 메뉴 -->
<nav class="bottom-nav" aria-label="주요 메뉴">
    <a href="stream.html">스밍</a>
    <a href="schedule.html">일정</a>
    <a href="index.html" class="active" aria-current="page">홈</a>
    <a href="content.html">콘텐츠</a>
    <a href="archive.html">아카이브</a>
</nav>

<script>
const albums = [
    {
        title: "The Chase",
        date: "2025.02.24",
        images: ["TheChase-scheduler.jpg"]
    },
    {
        title: "STYLE",
        date: "2025.06.18",
        images: ["STYLE-scheduler.jpg"]
    },
    {
        title: "FOCUS",
        date: "2025.10.20",
        images: ["FOCUS-scheduler.jpg"]
    },
    {
        title: "RUDE!",
        date: "2026.02.20",
        images: ["RUDE-scheduler.jpg"]
    },
    {
        title: "Lemon Tang",
        date: "2026.06.22",
        images: ["LemonTang-scheduler.jpg"]
    },
    {
        title: "ICONIC HEART",
        date: "2026.08.12",
        images: ["ICONICHEART-scheduler.png"]
    }
];

const listView = document.getElementById("listView");
const viewer = document.getElementById("viewer");
const albumList = document.getElementById("albumList");
const detailTitle = document.getElementById("detailTitle");
const detailDate = document.getElementById("detailDate");
const imageBox = document.getElementById("imageBox");

function renderList() {
    albumList.innerHTML = "";

    albums.forEach((album, index) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "album-card";
        card.setAttribute(
            "aria-label",
            album.title + " 프로모션 일정 보기"
        );

        const preview = document.createElement("div");
        preview.className = "album-art-wrap";

        const img = document.createElement("img");
        img.className = "album-art";
        img.src = album.images[0];
        img.alt = album.title + " 프로모션 일정 미리보기";
        img.loading = "lazy";

        img.addEventListener("error", function () {
            const error = document.createElement("div");
            error.className = "preview-error";
            error.textContent = "이미지를 불러올 수 없습니다.";
            img.replaceWith(error);
        }, { once: true });

        preview.appendChild(img);

        const info = document.createElement("div");
        info.className = "album-info";

        const name = document.createElement("h3");
        name.className = "album-name";
        name.textContent = album.title;

        const date = document.createElement("p");
        date.className = "album-date";
        date.textContent = album.date;

        info.append(name, date);
        card.append(preview, info);

        card.addEventListener("click", () => openAlbum(index));

        albumList.appendChild(card);
    });
}

function openAlbum(index) {
    const album = albums[index];

    if (!album) return;

    detailTitle.textContent = album.title;
    detailDate.textContent = "발매일 · " + album.date;
    imageBox.innerHTML = "";

    album.images.forEach((src) => {
        const img = document.createElement("img");

        img.src = src;
        img.alt = album.title + " 프로모션 일정";
        img.loading = "lazy";

        img.addEventListener("error", function () {
            const error = document.createElement("div");
            error.className = "image-error";

            const title = document.createElement("strong");
            title.textContent = "이미지를 불러올 수 없습니다.";

            const message = document.createElement("span");
            message.textContent = "파일명과 경로를 확인해주세요: " + src;

            error.append(title, message);
            img.replaceWith(error);
        }, { once: true });

        imageBox.appendChild(img);
    });

    listView.style.display = "none";
    viewer.style.display = "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

function showList() {
    viewer.style.display = "none";
    listView.style.display = "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

document.getElementById("backToList").addEventListener(
    "click",
    showList
);

renderList();
</script>

</body>
</html>
