<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>초동 판매량 | H2HCHIVE</title>

<style>
:root {
    --bg: #f5f6f8;
    --white: #ffffff;
    --text: #22252a;
    --muted: #9298a2;
    --line: #e9edf1;
    --blue: #89CFF0;
    --blue-light: #eaf7fd;
    --radius: 20px;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
}

button {
    font: inherit;
}

button:focus-visible,
a:focus-visible {
    outline: 3px solid var(--blue);
    outline-offset: 3px;
}

.page {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: 0 auto;
    padding-bottom: calc(94px + env(safe-area-inset-bottom, 0px));
}

/* 상단 제목 */

.top-header {
    padding: 32px 22px 0;
}

.page-title {
    margin: 0;
    font-size: 32px;
    line-height: 1.25;
    letter-spacing: -1.4px;
    font-weight: 850;
}

/* 앨범 목록 */

.content {
    padding: 30px 18px 20px;
}

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 0 3px 14px;
}

.section-title {
    margin: 0;
    font-size: 14px;
    font-weight: 800;
}

.section-caption {
    color: #9ba1aa;
    font-size: 11px;
}

.album-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.album-card {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 112px;
    padding: 17px;
    border: 1px solid rgba(226, 231, 236, .8);
    border-radius: var(--radius);
    background: var(--white);
    text-align: left;
    cursor: pointer;
    transition: transform .16s ease, border-color .16s ease;
    -webkit-tap-highlight-color: transparent;
}

.album-card:active {
    transform: scale(.985);
    border-color: var(--blue);
}

.album-art {
    position: relative;
    display: flex;
    flex: 0 0 72px;
    width: 72px;
    height: 76px;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-right: 15px;
    border-radius: 15px;
    background: linear-gradient(145deg, #edf9ff, #d9effb);
}

.album-art::before {
    content: "";
    position: absolute;
    width: 54px;
    height: 54px;
    top: -17px;
    right: -15px;
    border-radius: 50%;
    background: rgba(137, 207, 240, .45);
}

.album-art::after {
    content: "";
    position: absolute;
    width: 48px;
    height: 48px;
    left: -20px;
    bottom: -21px;
    border: 8px solid rgba(255, 255, 255, .7);
    border-radius: 50%;
}

.album-art .art-text {
    position: relative;
    z-index: 1;
    color: #4d9bc1;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1px;
    text-align: center;
}

.album-card:nth-child(2) .album-art {
    background: linear-gradient(145deg, #f0f0ff, #e0e5ff);
}

.album-card:nth-child(2) .album-art .art-text {
    color: #7b83c5;
}

.album-card:nth-child(2) .album-art::before {
    background: rgba(172, 178, 240, .38);
}

.album-card:nth-child(3) .album-art {
    background: linear-gradient(145deg, #fff5e9, #ffe6d4);
}

.album-card:nth-child(3) .album-art .art-text {
    color: #ce9369;
}

.album-card:nth-child(3) .album-art::before {
    background: rgba(255, 195, 151, .42);
}

.album-info {
    flex: 1;
    min-width: 0;
}

.album-label {
    display: inline-block;
    margin-bottom: 7px;
    padding: 4px 7px;
    border-radius: 6px;
    background: var(--blue-light);
    color: #549fc5;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .3px;
}

.album-name {
    margin: 0;
    overflow-wrap: anywhere;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -.45px;
}

.album-date {
    margin-top: 6px;
    color: #959ba4;
    font-size: 12px;
    font-weight: 500;
}

/* 앨범 상세 화면 */

#viewer {
    display: none;
}

/* 좌측 상단 뒤로가기 */

.detail-header {
    padding: 8px 18px 0;
}

.back-btn {
    display: inline-block;
    min-height: auto;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: #222;
    font-size: 1.5rem;
    font-weight: 400;
    line-height: 1.4;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.back-arrow {
    display: none;
}

.detail-content {
    padding: 12px 18px 24px;
}

.albumTitle {
    margin: 0;
    font-size: 29px;
    font-weight: 850;
    letter-spacing: -1px;
    overflow-wrap: anywhere;
}

.detail-subtitle {
    margin-top: 8px;
    color: #9298a2;
    font-size: 12px;
}

.image-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 24px 3px 13px;
}

.image-heading strong {
    font-size: 14px;
}

.image-heading span {
    display: none;
}

.imageBox {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.imageBox img {
    display: block;
    width: 100%;
    height: auto;
    min-height: 80px;
    border: 1px solid #e8ecf0;
    border-radius: 17px;
    background: #fff;
}

.image-error {
    padding: 22px 15px;
    border: 1px dashed #d7dfe6;
    border-radius: 15px;
    color: #858c96;
    font-size: 12px;
    line-height: 1.7;
    text-align: center;
}

.image-error strong {
    display: block;
    margin-bottom: 5px;
    color: #525a65;
    font-size: 13px;
}

/* 하단 메뉴 */

.bottom-nav {
    position: fixed;
    left: 50%;
    bottom: 0;
    z-index: 1000;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    width: 100%;
    max-width: 480px;
    padding: 7px 5px calc(7px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    border-top: 1px solid rgba(229, 233, 238, .9);
    background: rgba(255, 255, 255, .96);
    box-shadow: 0 -4px 18px rgba(0, 0, 0, .035);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
}

.bottom-nav a {
    position: relative;
    display: flex;
    min-width: 0;
    min-height: 45px;
    align-items: center;
    justify-content: center;
    padding: 0 2px;
    color: #969ca5;
    font-size: 11px;
    font-weight: 650;
    text-decoration: none;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
}

.bottom-nav a.active {
    color: #252a30;
    font-weight: 850;
}

.bottom-nav a.active::before {
    content: "";
    position: absolute;
    top: -7px;
    left: 30%;
    right: 30%;
    height: 3px;
    border-radius: 4px;
    background: var(--blue);
}

/* 작은 화면 대응 */

@media (max-width: 360px) {
    .top-header {
        padding-right: 18px;
        padding-left: 18px;
    }

    .content {
        padding-right: 14px;
        padding-left: 14px;
    }

    .page-title {
        font-size: 29px;
    }

    .album-card {
        padding: 14px;
    }

    .album-art {
        flex-basis: 63px;
        width: 63px;
        height: 68px;
        margin-right: 12px;
    }

    .album-name {
        font-size: 15px;
    }

    .bottom-nav a {
        font-size: 10px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="page">

    <header class="top-header">
        <h1 class="page-title">초동 판매량</h1>
    </header>

    <main class="content">

        <section id="listView" aria-label="앨범 목록">

            <div class="section-heading">
                <h2 class="section-title">앨범 목록</h2>
                <span class="section-caption">발매일 기준</span>
            </div>

            <div class="album-list" id="list"></div>

        </section>

        <section id="viewer" aria-label="앨범 초동 상세">

            <div class="detail-header">
                <button
                    class="back-btn"
                    type="button"
                    id="backToList"
                    aria-label="앨범 목록으로 돌아가기"
                >←</button>
            </div>

            <div class="detail-content">

                <h2 class="albumTitle" id="albumTitle"></h2>

                <div class="detail-subtitle" id="albumDate"></div>

                <div class="image-heading">
                    <strong>초동 기록</strong>
                </div>

                <div class="imageBox" id="imageBox"></div>

            </div>

        </section>

    </main>

</div>

<nav class="bottom-nav" aria-label="주요 메뉴">
    <a href="stream.html">스밍</a>
    <a href="schedule.html">일정</a>
    <a href="index.html">홈</a>
    <a href="content.html">콘텐츠</a>
    <a href="archive.html" class="active" aria-current="page">아카이브</a>
</nav>

<script>
const albums = [
    {
        title: "The Chase",
        date: "2025.02.24",
        images: [
            "TheChase-scheduler.jpg"
        ]
    },
    {
        title: "FOCUS",
        date: "2025.10.20",
        images: [
            "FOCUS-sales.png"
        ]
    },
    {
        title: "Lemon Tang",
        date: "2026.06.22",
        images: [
            "LemonTang-sales.png"
        ]
    }
];

const list = document.getElementById("list");
const listView = document.getElementById("listView");
const viewer = document.getElementById("viewer");
const albumTitle = document.getElementById("albumTitle");
const albumDate = document.getElementById("albumDate");
const imageBox = document.getElementById("imageBox");

function renderList() {
    list.innerHTML = "";

    albums.forEach((album, index) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "album-card";
        card.setAttribute("aria-label", album.title + " 초동 기록 보기");

        const art = document.createElement("div");
        art.className = "album-art";

        const artText = document.createElement("span");
        artText.className = "art-text";
        artText.textContent = "H2H";
        art.appendChild(artText);

        const info = document.createElement("div");
        info.className = "album-info";

        const label = document.createElement("span");
        label.className = "album-label";
        label.textContent = "초동 기록";

        const name = document.createElement("h3");
        name.className = "album-name";
        name.textContent = album.title;

        const date = document.createElement("div");
        date.className = "album-date";
        date.textContent = album.date;

        info.append(label, name, date);

        card.append(art, info);

        card.addEventListener("click", () => openAlbum(index));

        list.appendChild(card);
    });
}

function openAlbum(index) {
    const album = albums[index];

    if (!album) return;

    albumTitle.textContent = album.title;
    albumDate.textContent = "발매일 · " + album.date;
    imageBox.innerHTML = "";

    album.images.forEach((src) => {
        const img = document.createElement("img");

        img.src = src;
        img.alt = album.title + " 초동 판매량";
        img.loading = "lazy";

        img.addEventListener("error", () => {
            const error = document.createElement("div");
            error.className = "image-error";

            const title = document.createElement("strong");
            title.textContent = "이미지를 불러올 수 없습니다.";

            const message = document.createElement("span");
            message.textContent =
                "파일명과 경로를 확인해주세요: " + src;

            error.append(title, message);
            img.replaceWith(error);
        }, { once: true });

        imageBox.appendChild(img);
    });

    listView.style.display = "none";
    viewer.style.display = "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

function showList() {
    viewer.style.display = "none";
    listView.style.display = "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

document.getElementById("backToList").addEventListener("click", showList);

renderList();
</script>

</body>
</html>
