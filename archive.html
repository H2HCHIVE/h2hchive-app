<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>아카이브 | H2HCHIVE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f6f8;
    color: #222;
}

.container {
    max-width: 420px;
    margin: 0 auto;
    padding: 24px 16px calc(90px + env(safe-area-inset-bottom, 0px));
}

.back-btn {
    display: inline-block;
    text-decoration: none;
    color: #222;
    font-size: 1.5rem;
    margin-bottom: 20px;
}

.title {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 8px;
}

.subtitle {
    color: #888;
    font-size: 0.85rem;
    margin-bottom: 24px;
}

.archive-list {
    display: flex;
    flex-direction: column;
}

.archive-link {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 4px;
    border-bottom: 1px solid #ddd;
    text-decoration: none;
    color: #222;
    font-size: 1rem;
    font-weight: 600;
    transition: background .15s;
}

.archive-link:active {
    opacity: 0.6;
}

.archive-link .label {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.archive-link .description {
    font-size: 0.78rem;
    font-weight: 400;
    color: #888;
}

.arrow {
    color: #999;
    font-size: 1.1rem;
}

/* 하단 내비게이션 */

.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 9000;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    background: rgba(255, 255, 255, .97);
    border-top: 1px solid #e8e8e8;
    box-shadow: 0 -3px 14px rgba(0, 0, 0, .06);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.bottom-nav a {
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 42px;
    padding: 0 2px;
    color: #777;
    text-decoration: none;
    font-size: .75rem;
    font-weight: 600;
    white-space: nowrap;
}

.bottom-nav a.active {
    color: #222;
    font-weight: 800;
    position: relative;
}

.bottom-nav a.active::before {
    content: "";
    position: absolute;
    top: -6px;
    left: 28%;
    right: 28%;
    height: 3px;
    border-radius: 4px;
    background: #89CFF0;
}

@media (max-width: 360px) {
    .bottom-nav a {
        font-size: .68rem;
    }
}
</style>
</head>

            </span>
            <span class="arrow">→</span>
        </a>

        <a href="cheer.html" class="archive-link">
            <span class="label">
                <span>응원법</span>
                <span class="description">음악방송 응원법 모음</span>
            </span>
            <span class="arrow">→</span>
        </a>

        <a href="sales.html" class="archive-link">
            <span class="label">
                <span>초동</span>
                <span class="description">앨범 초동 판매량 기록</span>
            </span>
            <span class="arrow">→</span>
        </a>

        <a href="promotion_scheduler.html" class="archive-link">
            <span class="label">
                <span>프로모션 스케줄러</span>
                <span class="description">프로모션 일정 확인</span>
            </span>
            <span class="arrow">→</span>
        </a>

    </div>

</div>

<nav class="bottom-nav" aria-label="주요 메뉴">

</html>
