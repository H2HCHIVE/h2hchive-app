<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>스밍 일정 | H2HCHIVE</title>

<style>
* {
    box-sizing: border-box;
}

html {
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
    background: #f5f6f8;
    color: #222;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
}

body.picker-open {
    overflow: hidden;
}

.container {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    padding: 18px 16px 30px;
}

/* 탭 */

.tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
}

.tab {
    flex: 1;
    min-width: 0;
    text-align: center;
    padding: 11px 2px;
    background: #fff;
    border-radius: 10px;
    font-size: .82rem;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    transition: background .2s;
}

.tab.active {
    background: #89CFF0;
    color: #222;
    font-weight: 700;
}

/* 헤더 */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
}

.month {
    min-width: 0;
    font-size: 1.25rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    background: none;
    color: #222;
    font-family: inherit;
    padding: 8px;
    border-radius: 8px;
}

.month:active {
    background: #e6f5fc;
}

.btn {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    font-size: 1.5rem;
    border: none;
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
}

/* 연도·월 선택창 */

.picker-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    z-index: 20000;
}

.picker-overlay.open {
    display: flex;
}

.picker {
    width: 100%;
    max-width: 360px;
    background: #f5f6f8;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
}

.picker-title {
    font-size: 1.1rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 18px;
}

.picker-year-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 20px;
}

.picker-year-btn {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 10px;
    background: #fff;
    font-size: 1.2rem;
    cursor: pointer;
}

.picker-year {
    font-size: 1.15rem;
    font-weight: 700;
    min-width: 100px;
    text-align: center;
}

.picker-months {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
}

.picker-month {
    min-height: 44px;
    border: none;
    border-radius: 10px;
    background: #fff;
    padding: 10px 0;
    font-size: .9rem;
    cursor: pointer;
    color: #222;
}

.picker-month.selected {
    background: #89CFF0;
    font-weight: 700;
}

.picker-month:active,
.picker-year-btn:active {
    opacity: .7;
}

.picker-actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
}

.picker-action {
    flex: 1;
    min-height: 44px;
    border: none;
    border-radius: 10px;
    padding: 12px 0;
    font-size: .9rem;
    cursor: pointer;
}

.picker-cancel {
    background: #fff;
    color: #555;
}

.picker-confirm {
    background: #89CFF0;
    color: #222;
    font-weight: 700;
}

/* 월 이동 애니메이션 */

#calendarView {
    touch-action: pan-y;
    overflow: hidden;
}

#calendarView.slide-left {
    animation: slideLeft .25s ease forwards;
}

#calendarView.slide-right {
    animation: slideRight .25s ease forwards;
}

#calendarView.slide-in-left {
    animation: slideInLeft .25s ease forwards;
}

#calendarView.slide-in-right {
    animation: slideInRight .25s ease forwards;
}

@keyframes slideLeft {
    from { opacity: 1; transform: translateX(0); }
    to { opacity: 0; transform: translateX(-35px); }
}

@keyframes slideRight {
    from { opacity: 1; transform: translateX(0); }
    to { opacity: 0; transform: translateX(35px); }
}

@keyframes slideInLeft {
    from { opacity: 0; transform: translateX(35px); }
    to { opacity: 1; transform: translateX(0); }
}

@keyframes slideInRight {
    from { opacity: 0; transform: translateX(-35px); }
    to { opacity: 1; transform: translateX(0); }
}

/* 필터 */

.filters {
    margin-bottom: 14px;
}

.filter-group {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
}

.filter-group::-webkit-scrollbar {
    display: none;
}

.filter-label {
    flex-shrink: 0;
    font-size: .72rem;
    font-weight: 600;
    color: #999;
    width: 34px;
}

.filter-buttons {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
}

.filter-buttons button {
    min-height: 34px;
    border: none;
    background: #fff;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: .8rem;
    cursor: pointer;
    flex-shrink: 0;
}

.filter-buttons button.active {
    background: #222;
    color: #fff;
}

/* 요일 */

.weekdays {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    text-align: center;
    font-size: .85rem;
    font-weight: 600;
    margin-bottom: 6px;
}

.weekdays div:nth-child(1) {
    color: #e54848;
}

.weekdays div:nth-child(7) {
    color: #3979d6;
}

/* 캘린더 */

.calendar {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 5px;
}

.day {
    min-width: 0;
    min-height: 48px;
    background: #fff;
    border-radius: 10px;
    padding: 9px 0 5px;
    text-align: center;
    font-size: .9rem;
    cursor: pointer;
    position: relative;
}

.dim {
    opacity: .3;
}

.today {
    border: 2px solid #e54848;
    font-weight: 700;
    padding-top: 7px;
}

.dot {
    width: 5px;
    height: 5px;
    background: #999;
    border-radius: 50%;
    margin: 4px auto 0;
}

.today-dot {
    background: #e54848;
}

/* 일정 박스 */

.event-box {
    margin-top: 14px;
    background: #fff;
    border-radius: 14px;
    padding: 15px;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
    min-height: 60px;
    font-size: .9rem;
    line-height: 1.8;
    overflow-wrap: anywhere;
    white-space: normal;
}

/* 일정 줄 */

.line {
    display: block;
    margin-bottom: 6px;
    overflow-wrap: anywhere;
}

.line:last-child {
    margin-bottom: 0;
}

.highlight {
    font-weight: 800;
    background: #fff3b0;
    padding: 2px 4px;
    border-radius: 6px;
}

.dim-line {
    opacity: .3;
}

/* 전체 일정 / 하이라이트 */

.list {
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    white-space: pre-line;
    font-size: .9rem;
    line-height: 1.8;
    overflow-wrap: anywhere;
}

.list b {
    display: inline-block;
    margin-bottom: 4px;
}

/* 하단 메뉴 */

.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 9000;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    background: rgba(255,255,255,.97);
    border-top: 1px solid #e8e8e8;
    box-shadow: 0 -3px 14px rgba(0,0,0,.06);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.bottom-nav a {
    min-width: 0;
    min-height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 2px;
    color: #777;
    text-decoration: none;
    font-size: .78rem;
    font-weight: 600;
    white-space: nowrap;
    position: relative;
}

.bottom-nav a.active {
    color: #222;
    font-weight: 800;
}

.bottom-nav a.active::before {
    content: "";
    position: absolute;
    top: -6px;
    left: 28%;
    right: 28%;
    height: 3px;
    border-radius: 4px;
    background: #89CFF0;
}

@media (max-width: 360px) {
    .container {
        padding-left: 12px;
        padding-right: 12px;
    }

    .tabs {
        gap: 4px;
    }

    .tab {
        font-size: .75rem;
    }

    .calendar {
        gap: 4px;
    }

    .day {
        min-height: 43px;
        padding-top: 7px;
        font-size: .83rem;
    }

    .today {
        padding-top: 5px;
    }

    .event-box,
    .list {
        padding: 12px;
    }

    .bottom-nav a {
        font-size: .72rem;
    }
}

@media (prefers-reduced-motion: reduce) {
    #calendarView.slide-left,
    #calendarView.slide-right,
    #calendarView.slide-in-left,
    #calendarView.slide-in-right {
        animation: none;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- 탭 -->
    <div class="tabs">
        <div class="tab active" onclick="setTab('calendar', this)">📅 캘린더</div>
        <div class="tab" onclick="setTab('list', this)">📋 전체 일정</div>
        <div class="tab" onclick="setTab('highlight', this)">🔥 하이라이트</div>
    </div>

    <!-- 캘린더 -->
    <div id="calendarView">

        <div class="header">
            <button class="btn" onclick="prev()" aria-label="이전 달">←</button>

            <button class="month" id="month" onclick="openPicker()"></button>

            <button class="btn" onclick="next()" aria-label="다음 달">→</button>
        </div>

        <!-- 필터 -->
        <div class="filters">

            <div class="filter-group">
                <div class="filter-label">종류</div>

                <div class="filter-buttons">
                    <button onclick="setTypeFilter('all', this)" class="active">전체</button>
                    <button onclick="setTypeFilter('📺', this)">📺</button>
                    <button onclick="setTypeFilter('📻', this)">📻</button>
                    <button onclick="setTypeFilter('✒️', this)">✒️</button>
                    <button onclick="setTypeFilter('🎤', this)">🎤</button>
                    <button onclick="setTypeFilter('💿', this)">💿</button>
                    <button onclick="setTypeFilter('▶️', this)">▶️</button>
                    <button onclick="setTypeFilter('🗓', this)">🗓</button>
                </div>
            </div>

            <div class="filter-group">
                <div class="filter-label">멤버</div>

                <div class="filter-buttons">
                    <button onclick="setMemberFilter('all', this)" class="active">전체</button>
                    <button onclick="setMemberFilter('🍓', this)">🍓</button>
                    <button onclick="setMemberFilter('🌴', this)">🌴</button>
                    <button onclick="setMemberFilter('🎀', this)">🎀</button>
                    <button onclick="setMemberFilter('🧁', this)">🧁</button>
                    <button onclick="setMemberFilter('👾', this)">👾</button>
                    <button onclick="setMemberFilter('🌻', this)">🌻</button>
                    <button onclick="setMemberFilter('🫛', this)">🫛</button>
                    <button onclick="setMemberFilter('😊', this)">😊</button>
                </div>
            </div>

        </div>

        <div class="weekdays">
            <div>일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div>토</div>
        </div>

        <div class="calendar" id="calendar"></div>

        <div class="event-box" id="eventBox">날짜를 클릭하세요</div>

    </div>

    <div id="listView" style="display:none;"></div>
    <div id="highlightView" style="display:none;"></div>

</div>

<!-- 연도·월 선택창 -->
<div class="picker-overlay" id="pickerOverlay" onclick="handleOverlayClick(event)">
    <div class="picker" role="dialog" aria-modal="true" aria-label="날짜 이동">

        <div class="picker-title">날짜 이동</div>

        <div class="picker-year-row">
            <button class="picker-year-btn" onclick="changePickerYear(-1)" aria-label="이전 연도">‹</button>
            <div class="picker-year" id="pickerYear"></div>
            <button class="picker-year-btn" onclick="changePickerYear(1)" aria-label="다음 연도">›</button>
        </div>

        <div class="picker-months" id="pickerMonths">
            <button class="picker-month" data-month="0" onclick="selectPickerMonth(0)">1월</button>
            <button class="picker-month" data-month="1" onclick="selectPickerMonth(1)">2월</button>
            <button class="picker-month" data-month="2" onclick="selectPickerMonth(2)">3월</button>
            <button class="picker-month" data-month="3" onclick="selectPickerMonth(3)">4월</button>
            <button class="picker-month" data-month="4" onclick="selectPickerMonth(4)">5월</button>
            <button class="picker-month" data-month="5" onclick="selectPickerMonth(5)">6월</button>
            <button class="picker-month" data-month="6" onclick="selectPickerMonth(6)">7월</button>
            <button class="picker-month" data-month="7" onclick="selectPickerMonth(7)">8월</button>
            <button class="picker-month" data-month="8" onclick="selectPickerMonth(8)">9월</button>
            <button class="picker-month" data-month="9" onclick="selectPickerMonth(9)">10월</button>
            <button class="picker-month" data-month="10" onclick="selectPickerMonth(10)">11월</button>
            <button class="picker-month" data-month="11" onclick="selectPickerMonth(11)">12월</button>
        </div>

        <div class="picker-actions">
            <button class="picker-action picker-cancel" onclick="closePicker()">취소</button>
            <button class="picker-action picker-confirm" onclick="confirmPicker()">이동</button>
        </div>

    </div>
</div>

<!-- 하단 메뉴 -->
<nav class="bottom-nav" aria-label="주요 메뉴">
    <a href="stream.html">스밍</a>
    <a href="index.html">홈</a>
    <a href="schedule.html" class="active" aria-current="page">스밍 일정</a>
    <a href="musicshow.html">음방</a>
</nav>

<script>
/* ==========================================
   기본 상태
========================================== */

let date = new Date();
let data = {};
let loadedYears = {};
let typeFilter = 'all';
let memberFilter = 'all';

let pickerYear = date.getFullYear();
let pickerMonth = date.getMonth();

/* ==========================================
   연도별 JSON 불러오기
========================================== */

function loadYear(year) {
    if (loadedYears[year]) {
        data = loadedYears[year];
        render();
        return;
    }

    fetch(`./schedule-${year}.json`)
        .then(res => {
            if (!res.ok) {
                throw new Error(`schedule-${year}.json 로딩 실패`);
            }
            return res.json();
        })
        .then(json => {
            loadedYears[year] = json;
            data = json;
            render();
        })
        .catch(err => {
            console.error(err);
            loadedYears[year] = {};
            data = {};
            render();
        });
}

/* ==========================================
   최초 실행
========================================== */

loadYear(date.getFullYear());

/* ==========================================
   연도·월 선택창
========================================== */

function openPicker() {
    pickerYear = date.getFullYear();
    pickerMonth = date.getMonth();

    updatePicker();

    document.getElementById('pickerOverlay').classList.add('open');
    document.body.classList.add('picker-open');

    history.pushState({ h2hchivePicker: true }, '', location.href);
}

function closePicker() {
    document.getElementById('pickerOverlay').classList.remove('open');
    document.body.classList.remove('picker-open');
}

function handleOverlayClick(event) {
    if (event.target.id === 'pickerOverlay') {
        closePicker();
    }
}

function changePickerYear(direction) {
    pickerYear += direction;
    updatePicker();
}

function selectPickerMonth(month) {
    pickerMonth = month;
    updatePicker();
}

function updatePicker() {
    document.getElementById('pickerYear').innerText = `${pickerYear}년`;

    document.querySelectorAll('.picker-month').forEach(button => {
        const month = Number(button.dataset.month);
        button.classList.toggle('selected', month === pickerMonth);
    });
}

function confirmPicker() {
    const targetYear = pickerYear;
    const targetMonth = pickerMonth;
    const yearChanged = targetYear !== date.getFullYear();

    date = new Date(targetYear, targetMonth, 1);
    closePicker();

    if (yearChanged) {
        loadYear(targetYear);
    } else {
        data = loadedYears[targetYear] || data;
        render();
    }
}

/* ==========================================
   탭
========================================== */

function setTab(t, el) {
    document.querySelectorAll('.tab').forEach(b => {
        b.classList.remove('active');
    });

    el.classList.add('active');

    document.getElementById('calendarView').style.display =
        t === 'calendar' ? 'block' : 'none';

    document.getElementById('listView').style.display =
        t === 'list' ? 'block' : 'none';

    document.getElementById('highlightView').style.display =
        t === 'highlight' ? 'block' : 'none';

    render();
}

/* ==========================================
   일정 종류 필터
========================================== */

function setTypeFilter(f, btn) {
    typeFilter = f;

    document.querySelectorAll(
        '.filter-group:nth-child(1) .filter-buttons button'
    ).forEach(b => {
        b.classList.remove('active');
    });

    btn.classList.add('active');
    render();
}

/* ==========================================
   멤버 필터
========================================== */

function setMemberFilter(f, btn) {
    memberFilter = f;

    document.querySelectorAll(
        '.filter-group:nth-child(2) .filter-buttons button'
    ).forEach(b => {
        b.classList.remove('active');
    });

    btn.classList.add('active');
    render();
}

/* ==========================================
   필터 매칭
========================================== */

function matchesFilter(text) {
    const typeMatch =
        typeFilter === 'all' || text.includes(typeFilter);

    const memberMatch =
        memberFilter === 'all' || text.includes(memberFilter);

    return typeMatch && memberMatch;
}

function hasActiveFilter() {
    return typeFilter !== 'all' || memberFilter !== 'all';
}

/* ==========================================
   캘린더 렌더링
========================================== */

function render() {
    const y = date.getFullYear();
    const m = date.getMonth();

    document.getElementById('month').innerText =
        `${y}년 ${m + 1}월`;

    const cal = document.getElementById('calendar');
    cal.innerHTML = '';

    const first = new Date(y, m, 1).getDay();
    const last = new Date(y, m + 1, 0).getDate();

    const today = new Date();

    const todayKey =
        `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

    for (let i = 0; i < first; i++) {
        cal.innerHTML += '<div></div>';
    }

    for (let d = 1; d <= last; d++) {
        const key =
            `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

        const text = data[key] || '';
        const has = text.length > 0;
        const isToday = key === todayKey;

        const match = has && text
            .split('\n')
            .some(line => matchesFilter(line));

        cal.innerHTML += `
            <div
                class="day ${isToday ? 'today' : ''} ${hasActiveFilter() && !match ? 'dim' : ''}"
                onclick="show('${key}')"
            >
                ${d}
                ${
                    isToday
                        ? '<div class="dot today-dot"></div>'
                        : (has ? '<div class="dot"></div>' : '')
                }
            </div>
        `;
    }

    renderList();
    renderHighlight();

    if (today.getFullYear() === y && today.getMonth() === m) {
        show(todayKey);
    } else {
        document.getElementById('eventBox').innerHTML = '날짜를 클릭하세요';
    }
}

/* ==========================================
   날짜 클릭
========================================== */

function show(key) {
    const text = data[key] || '일정 없음';
    const lines = text.split('\n');

    const html = lines.map(line => {
        const typeMatch =
            typeFilter === 'all' || line.includes(typeFilter);

        const memberMatch =
            memberFilter === 'all' || line.includes(memberFilter);

        const match = typeMatch && memberMatch;

        if (!hasActiveFilter()) {
            return `<div class="line">${line}</div>`;
        }

        if (match) {
            return `<div class="line highlight">${line}</div>`;
        }

        return `<div class="line dim-line">${line}</div>`;
    }).join('');

    document.getElementById('eventBox').innerHTML = html;
}

/* ==========================================
   전체 일정
========================================== */

function renderList() {
    const el = document.getElementById('listView');

    const currentMonth =
        `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;

    let html = '';

    Object.keys(data).sort().forEach(k => {
        if (!k.startsWith(currentMonth)) return;

        html += `
            <div class="list">
                <b>${k}</b><br>
                ${data[k]}
            </div>
        `;
    });

    el.innerHTML = html || '<div class="list">등록된 일정이 없습니다.</div>';
}

/* ==========================================
   하이라이트
========================================== */

function renderHighlight() {
    const el = document.getElementById('highlightView');

    const currentMonth =
        `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;

    let html = '';

    Object.keys(data).sort().forEach(k => {
        if (!k.startsWith(currentMonth)) return;

        const lines = data[k].split('\n');

        const filtered = lines.filter(line =>
            line.includes('💿') ||
            line.includes('🎉') ||
            line.includes('🍓') ||
            line.includes('🌴') ||
            line.includes('🎀') ||
            line.includes('🧁') ||
            line.includes('👾') ||
            line.includes('🌻') ||
            line.includes('🫛') ||
            line.includes('😊')
        );

        if (filtered.length > 0) {
            html += `
                <div class="list">
                    <b>${k}</b><br>
                    ${filtered.join('\n')}
                </div>
            `;
        }
    });

    el.innerHTML = html || '<div class="list">이번 달 하이라이트 일정이 없습니다.</div>';
}

/* ==========================================
   월 이동 애니메이션
========================================== */

let monthAnimating = false;

function changeMonth(direction) {
    if (monthAnimating) return;

    monthAnimating = true;

    const calendarView = document.getElementById('calendarView');

    calendarView.classList.remove(
        'slide-left',
        'slide-right',
        'slide-in-left',
        'slide-in-right'
    );

    calendarView.classList.add(
        direction > 0 ? 'slide-left' : 'slide-right'
    );

    setTimeout(function() {
        date.setMonth(date.getMonth() + direction);

        const year = date.getFullYear();

        if (!loadedYears[year]) {
            loadYear(year);
        } else {
            data = loadedYears[year];
            render();
        }

        calendarView.classList.remove('slide-left', 'slide-right');

        calendarView.classList.add(
            direction > 0 ? 'slide-in-left' : 'slide-in-right'
        );

        setTimeout(function() {
            calendarView.classList.remove(
                'slide-in-left',
                'slide-in-right'
            );

            monthAnimating = false;
        }, 250);

    }, 250);
}

function prev() {
    changeMonth(-1);
}

function next() {
    changeMonth(1);
}

/* ==========================================
   캘린더 스와이프
========================================== */

let touchStartX = 0;
let touchStartY = 0;

const calendarView = document.getElementById('calendarView');

calendarView.addEventListener('touchstart', function(e) {
    if (e.target.closest('.filter-group')) {
        touchStartX = 0;
        touchStartY = 0;
        return;
    }

    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}, { passive: true });

calendarView.addEventListener('touchend', function(e) {
    if (touchStartX === 0) return;

    const touchEndX = e.changedTouches[0].clientX;
    const touchEndY = e.changedTouches[0].clientY;

    const distanceX = touchEndX - touchStartX;
    const distanceY = touchEndY - touchStartY;

    if (Math.abs(distanceX) > Math.abs(distanceY)) {
        if (distanceX < -50) {
            next();
        } else if (distanceX > 50) {
            prev();
        }
    }

    touchStartX = 0;
    touchStartY = 0;
}, { passive: true });

/* ==========================================
   뒤로 가기
========================================== */

window.addEventListener('popstate', function() {
    const picker = document.getElementById('pickerOverlay');

    if (picker.classList.contains('open')) {
        closePicker();
    }
});

/* ESC 키로 날짜 선택창 닫기 */

document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        closePicker();
    }
});
</script>
