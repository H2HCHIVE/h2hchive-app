<style>
html {
    overscroll-behavior-y: none;
    -webkit-tap-highlight-color: transparent;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
    background: #f5f6f8;
    color: #222;
    overscroll-behavior-y: none;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: calc(140px + env(safe-area-inset-bottom, 0px));
}

body.menu-open {
    overflow: hidden;
}

/* =========================
   MAIN CONTAINER
   ========================= */

.container {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    padding: 20px 24px 32px;
}

.header {
    margin-bottom: 24px;
}

/* =========================
   D-DAY
   ========================= */

#dday-container {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-items: center;
    width: 100%;
    min-height: 60px;
    overflow: visible;
}

#dday-box {
    position: relative;
    grid-column: 1;
    grid-row: 1;
    width: 100%;
    min-width: 0;
    margin: 0;
    padding: 6px 56px;
    text-align: center;
    touch-action: pan-y;
    user-select: none;
}

#dday-text {
    font-size: 1.1rem;
    font-weight: 800;
}

#dday-label {
    font-size: 1.6rem;
    font-weight: 900;
}

.dday-menu-button {
    position: relative;
    grid-column: 1;
    grid-row: 1;
    justify-self: end;
    align-self: center;
    z-index: 2;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 14px;
    background: #fff;
    color: #222;
    font-family: inherit;
    font-size: 25px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.07);
    -webkit-tap-highlight-color: transparent;
}

.dday-menu-button:active {
    transform: scale(.96);
}

#dday-box.slide-out-left {
    animation: ddaySlideOutLeft .4s ease forwards;
}

#dday-box.slide-out-right {
    animation: ddaySlideOutRight .4s ease forwards;
}

#dday-box.slide-in-left {
    animation: ddaySlideInLeft .4s ease forwards;
}

#dday-box.slide-in-right {
    animation: ddaySlideInRight .4s ease forwards;
}

@keyframes ddaySlideOutLeft {
    from { opacity: 1; transform: translateX(0); }
    to { opacity: 0; transform: translateX(-30px); }
}

@keyframes ddaySlideOutRight {
    from { opacity: 1; transform: translateX(0); }
    to { opacity: 0; transform: translateX(30px); }
}

@keyframes ddaySlideInLeft {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
}

@keyframes ddaySlideInRight {
    from { opacity: 0; transform: translateX(-30px); }
    to { opacity: 1; transform: translateX(0); }
}

#dday-indicator {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    margin: 5px 0;
}

.dday-dot {
    font-size: 8px;
    line-height: 1;
    color: #d5d5d5;
    transition: color .25s ease, transform .25s ease;
}

.dday-dot.active {
    color: #89CFF0;
    transform: scale(1.15);
}

/* =========================
   SCHEDULE / MISSION
   ========================= */

.todo-section {
    margin: 25px 0;
}

.todo-box {
    background: #fff;
    border-radius: 18px;
    padding: 17px;
    box-shadow: 0 4px 12px rgba(0,0,0,.06);
    line-height: 2;
    overflow-wrap: anywhere;
}

.todo-header {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid #eee;
}

.mission-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin: 8px 0;
}

.mission-row span {
    min-width: 0;
    overflow-wrap: anywhere;
}

.mission-btn {
    flex-shrink: 0;
    background: #222;
    color: #fff;
    text-decoration: none;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: .8rem;
    font-weight: 600;
    white-space: nowrap;
}

#iconic-heart-count {
    font-variant-numeric: tabular-nums;
}

/* =========================
   MV SWIPER
   ========================= */

.mvSwiper {
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 12px rgba(0,0,0,.07);
}

.mvSwiper iframe {
    display: block;
    width: 100%;
    height: clamp(170px, 48vw, 220px);
    border: 0;
}

.swiper-pagination {
    position: relative;
    margin-top: 10px;
}

/* =========================
   FULLSCREEN MENU
   ========================= */

.fullscreen-menu {
    position: fixed;
    inset: 0;
    z-index: 20000;
    display: none;
    overflow-y: auto;
    overscroll-behavior: contain;
    background: #f5f6f8;
    padding:
        calc(20px + env(safe-area-inset-top, 0px))
        24px
        calc(24px + env(safe-area-inset-bottom, 0px));
}

.fullscreen-menu.open {
    display: block;
}

.fullscreen-menu-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 420px;
    margin: 0 auto 24px;
}

.fullscreen-menu-title {
    font-size: 1.3rem;
    font-weight: 800;
}

.fullscreen-menu-close {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    background: #fff;
    color: #222;
    font-family: inherit;
    font-size: 26px;
    cursor: pointer;
}

.fullscreen-menu-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 420px;
    margin: 0 auto;
}

.fullscreen-menu-item {
    width: 100%;
    min-height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 17px;
    border: none;
    border-radius: 15px;
    background: #fff;
    color: #222;
    text-align: left;
    text-decoration: none;
    font-family: inherit;
    font-size: .96rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,.04);
}

.fullscreen-menu-item:active {
    transform: scale(.99);
}

.fullscreen-menu-item .arrow {
    flex-shrink: 0;
    color: #999;
    font-size: 1.2rem;
    font-weight: 400;
}

/* 공식 계정: 기본적으로 열린 상태 */
.fullscreen-sns {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    padding: 16px 8px;
    border-radius: 15px;
    background: #fff;
}

.fullscreen-sns a {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 5px 0;
    color: #444;
    text-decoration: none;
    font-size: .72rem;
    font-weight: 600;
}

.fullscreen-sns a:active {
    opacity: .65;
}

.fullscreen-sns img {
    width: 28px;
    height: 28px;
    display: block;
    object-fit: contain;
}

.fullscreen-menu-copyright {
    max-width: 420px;
    margin: 26px auto 0;
    font-size: .73rem;
    line-height: 1.8;
    color: #777;
    text-align: center;
}

/* =========================
   KST MINI PLAYER
   ========================= */

.kst-player {
    position: fixed;
    left: 24px;
    right: 24px;
    bottom: calc(66px + env(safe-area-inset-bottom, 0px));
    width: auto;
    min-height: 48px;
    background: rgba(255,255,255,.97);
    border: 1px solid rgba(137,207,240,.45);
    border-radius: 13px;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
    display: flex;
    align-items: center;
    padding: 7px 11px;
    z-index: 8000;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: opacity .25s ease, transform .25s ease;
}

.kst-player.scrolling {
    opacity: .28;
    transform: translateY(2px);
}

.kst-player-info {
    min-width: 0;
    width: 100%;
    overflow: hidden;
}

.kst-player-song {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
}

.kst-player-title {
    min-width: 0;
    font-size: 12px;
    font-weight: 700;
    line-height: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #222;
}

.kst-player-number {
    font-size: 8px;
    font-weight: 600;
    color: #89CFF0;
    white-space: nowrap;
    flex-shrink: 0;
}

.kst-player-time {
    font-size: 10px;
    color: #888;
    line-height: 13px;
}

.kst-player-progress {
    width: 100%;
    height: 2px;
    margin-top: 2px;
    background: #e5e5e5;
    border-radius: 999px;
    overflow: hidden;
}

.kst-player-progress-bar {
    width: 0%;
    height: 100%;
    background: #89CFF0;
    transition: width .5s linear;
}

/* =========================
   FIXED BOTTOM NAVIGATION
   ========================= */

.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 9000;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    background: rgba(255,255,255,.97);
    border-top: 1px solid #e8e8e8;
    box-shadow: 0 -3px 14px rgba(0,0,0,.06);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.bottom-nav a {
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 42px;
    padding: 0 2px;
    color: #777;
    text-decoration: none;
    font-size: .75rem;
    font-weight: 600;
    white-space: nowrap;
}

.bottom-nav a.active {
    color: #222;
    font-weight: 800;
    position: relative;
}

.bottom-nav a.active::before {
    content: "";
    position: absolute;
    top: -6px;
    left: 28%;
    right: 28%;
    height: 3px;
    border-radius: 4px;
    background: #89CFF0;
}

/* =========================
   RESPONSIVE
   ========================= */

@media (max-width: 360px) {

    }

    .fullscreen-menu {
        padding-left: 20px;
        padding-right: 20px;
    }

    .fullscreen-sns {
        gap: 5px;
    }

    .todo-box {
        padding: 15px;
    }
}
</style>

<script>
/* =========================
   FULLSCREEN MENU
   ========================= */

const fullscreenMenu = document.getElementById("fullscreen-menu");
const openFullscreenMenu = document.getElementById("open-fullscreen-menu");
const closeFullscreenMenu = document.getElementById("close-fullscreen-menu");

function openMenu() {
    fullscreenMenu.classList.add("open");
    fullscreenMenu.setAttribute("aria-hidden", "false");
    document.body.classList.add("menu-open");
    closeFullscreenMenu.focus();
}

function closeMenu() {
    fullscreenMenu.classList.remove("open");
    fullscreenMenu.setAttribute("aria-hidden", "true");
    document.body.classList.remove("menu-open");
    openFullscreenMenu.focus();
}

openFullscreenMenu.addEventListener("click", openMenu);
closeFullscreenMenu.addEventListener("click", closeMenu);

document.addEventListener("keydown", function (event) {
    if (
        event.key === "Escape" &&
        fullscreenMenu.classList.contains("open")
    ) {
        closeMenu();
    }
});

/* =========================
   MISSION
   ========================= */

function toKSTDate(str) {
    return new Date(str + "T00:00:00+09:00");
}

const mission = document.getElementById("mission-list");

const schedules = [
    {
        start: "2026-10-15",
        end: "2026-10-29",
        items: [
            {
                text: "🗳MMA TOP10 투표하기",
                link: "https://m2.melon.com/mma/2026/vote/top10/"
            }
        ]
    },
    {
        start: "2026-10-08",
        end: "2026-11-04",
        items: [
            {
                text: "🗳AAA 인기상 여자그룹 투표하기",
                link: "https://promo-web.idolchamp.com/app_proxy.html?deeplink=https%3A%2F%2Fapp.idolchamp.com%2Fopen%2Fvote%2F01M4784X9DKK87B0J1GB669P3R"
            }
        ]
    }
];

const now = new Date();
let currentMission = [];

for (const s of schedules) {
    const start = toKSTDate(s.start);
    const end = toKSTDate(s.end);

    end.setHours(23, 59, 59, 999);

    if (now >= start && now <= end) {
        currentMission.push(...s.items);
    }
}

mission.innerHTML = currentMission.length
    ? currentMission.map(item => `
        <div class="mission-row">
            <span>✅️ ${item.text}</span>
            <a class="mission-btn"
               href="${item.link}"
               target="_blank"
               rel="noopener noreferrer">바로가기</a>
        </div>
    `).join("")
    : "진행 중인 미션이 없습니다.";

/* =========================
   D-DAY
   ========================= */

const ddayList = [
    {
        name: "👾주은 생일",
        date: "2026-12-03T00:00:00+09:00",
        type: "dday"
    },
    {
        name: "🌻에이나 생일",
        date: "2026-12-20T00:00:00+09:00",
        type: "dday"
    },
    {
        name: "🎉데뷔",
        date: "2025-02-24T00:00:00+09:00",
        type: "debut"
    }
];

let ddayIndex = 0;

const ddayBox = document.getElementById("dday-box");
const ddayText = document.getElementById("dday-text");
const ddayLabel = document.getElementById("dday-label");
const ddayIndicator = document.getElementById("dday-indicator");

ddayIndicator.innerHTML = ddayList.map((item, index) => `
    <span class="dday-dot ${index === 0 ? "active" : ""}" data-index="${index}">●</span>
`).join("");

function updateDdayIndicator() {
    const dots = ddayIndicator.querySelectorAll(".dday-dot");

    dots.forEach((dot, index) => {
        dot.classList.toggle("active", index === ddayIndex);
    });
}

function updateDday() {
    const item = ddayList[ddayIndex];
    const nowDate = new Date();
    const target = new Date(item.date);

    ddayText.textContent = item.name;

    const diff = target - nowDate;
    const day = Math.ceil(diff / (1000 * 60 * 60 * 24));

    if (item.type === "debut") {
        const start = new Date(2025, 1, 24);

        const todayDate = new Date(
            nowDate.getFullYear(),
            nowDate.getMonth(),
            nowDate.getDate()
        );

        const diffDays = Math.floor(
            (todayDate - start) / (1000 * 60 * 60 * 24)
        ) + 1;

        ddayLabel.textContent = `D+${diffDays}`;
        updateDdayIndicator();
        return;
    }

    ddayLabel.textContent = diff > 0 ? `D-${day}` : "D-DAY";
    updateDdayIndicator();
}

let ddayAnimating = false;
let ddayTimer;

function resetDdayTimer() {
    clearTimeout(ddayTimer);

    ddayTimer = setTimeout(function () {
        moveDday(1);
    }, 10000);
}

function moveDday(dir = 1) {
    if (ddayAnimating) return;

    ddayAnimating = true;
    clearTimeout(ddayTimer);

    ddayBox.classList.remove(
        "slide-in-left",
        "slide-in-right",
        "slide-out-left",
        "slide-out-right"
    );

    ddayBox.classList.add(
        dir > 0 ? "slide-out-left" : "slide-out-right"
    );

    setTimeout(function () {
        ddayIndex += dir;

        if (ddayIndex < 0) {
            ddayIndex = ddayList.length - 1;
        }

        if (ddayIndex >= ddayList.length) {
            ddayIndex = 0;
        }

        updateDday();

        ddayBox.classList.remove("slide-out-left", "slide-out-right");

        ddayBox.classList.add(
            dir > 0 ? "slide-in-left" : "slide-in-right"
        );

        setTimeout(function () {
            ddayBox.classList.remove("slide-in-left", "slide-in-right");
            ddayAnimating = false;
            resetDdayTimer();
        }, 400);

    }, 400);
}

updateDday();
resetDdayTimer();

/* D-DAY SWIPE */

let ddayTouchStartX = 0;
let ddayTouchStartY = 0;

ddayBox.addEventListener("touchstart", function (e) {
    ddayTouchStartX = e.touches[0].clientX;
    ddayTouchStartY = e.touches[0].clientY;
}, { passive: true });

ddayBox.addEventListener("touchend", function (e) {
    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;

    const distanceX = endX - ddayTouchStartX;
    const distanceY = endY - ddayTouchStartY;

    if (Math.abs(distanceX) > Math.abs(distanceY)) {
        if (distanceX > 50) {
            moveDday(-1);
        } else if (distanceX < -50) {
            moveDday(1);
        }
    }
}, { passive: true });

/* =========================
   KST SYNC PLAYLIST
   ========================= */

const kstStartTime = new Date("2026-10-05T18:30:00+09:00");
const kstStartIndex = 16;

const kstPlaylist = [
    { title: "Lemon Tang", duration: 163 },
    { title: "ICONIC HEART (Korean.ver)", duration: 189 },
    { title: "RUDE!", duration: 200 },
    { title: "FOCUS", duration: 178 },
    { title: "Moonride", duration: 177 },
    { title: "Lemon Tang", duration: 163 },
    { title: "ICONIC HEART (Japanese.ver)", duration: 189 },
    { title: "RUDE!", duration: 200 },
    { title: "STYLE", duration: 210 },
    { title: "15-LOVE", duration: 155 },
    { title: "Lemon Tang", duration: 163 },
    { title: "ICONIC HEART (Korean.ver)", duration: 189 },
    { title: "RUDE!", duration: 200 },
    { title: "FOCUS", duration: 178 },
    { title: "ICONIC HEART (Japanese.ver)", duration: 189 },
    { title: "Lemon Tang", duration: 163 },
    { title: "ICONIC HEART (Korean.ver)", duration: 189 },
    { title: "RUDE!", duration: 200 },
    { title: "STYLE", duration: 210 }
];

const kstTotalDuration = kstPlaylist.reduce(
    (total, song) => total + song.duration, 0
);

const kstStartOffset = kstPlaylist
    .slice(0, kstStartIndex)
    .reduce((total, song) => total + song.duration, 0);

const kstPlayerTitle = document.getElementById("kst-player-title");
const kstPlayerNumber = document.getElementById("kst-player-number");
const kstPlayerTime = document.getElementById("kst-player-time");
const kstPlayerProgress = document.getElementById("kst-player-progress-bar");

function formatKstTime(seconds) {
    seconds = Math.max(0, Math.floor(seconds));

    const minutes = Math.floor(seconds / 60);
    const remaining = seconds % 60;

    return minutes + ":" + String(remaining).padStart(2, "0");
}

function getKstPlayerPosition() {
    const nowMs = Date.now();
    const startMs = kstStartTime.getTime();

    if (nowMs < startMs) {
        return { index: kstStartIndex, position: 0 };
    }

    const elapsed = Math.floor((nowMs - startMs) / 1000);
    const cyclePosition = (kstStartOffset + elapsed) % kstTotalDuration;

    let accumulated = 0;

    for (let i = 0; i < kstPlaylist.length; i++) {
        const song = kstPlaylist[i];
        const songEnd = accumulated + song.duration;

        if (cyclePosition < songEnd) {
            return {
                index: i,
                position: cyclePosition - accumulated
            };
        }

        accumulated = songEnd;
    }

    return { index: kstStartIndex, position: 0 };
}

function updateKstPlayer() {
    const current = getKstPlayerPosition();
    const song = kstPlaylist[current.index];
    const position = current.position;

    kstPlayerTitle.textContent = song.title;

    kstPlayerNumber.textContent =
        `${current.index + 1} / ${kstPlaylist.length}`;

    kstPlayerTime.textContent =
        formatKstTime(position) + " / " + formatKstTime(song.duration);

    const progress = (position / song.duration) * 100;

    kstPlayerProgress.style.width =
        Math.min(100, Math.max(0, progress)) + "%";
}

setInterval(updateKstPlayer, 1000);
updateKstPlayer();

/* =========================
   ICONIC HEART COUNTER
   ========================= */

const iconicHeartCompletionOffsets = [189, 951, 2775];

function getIconicHeartCount() {
    const nowMs = Date.now();
    const startMs = kstStartTime.getTime();

    if (nowMs < startMs) return 0;

    const elapsed = Math.floor((nowMs - startMs) / 1000);
    const completedCycles = Math.floor(elapsed / kstTotalDuration);
    const currentCyclePosition = elapsed % kstTotalDuration;

    let count = completedCycles * 3;

    for (const offset of iconicHeartCompletionOffsets) {
        if (currentCyclePosition >= offset) {
            count++;
        }
    }

    return count;
}

function updateIconicHeartCount() {
    const el = document.getElementById("iconic-heart-count");

    if (el) {
        el.textContent = getIconicHeartCount().toLocaleString("ko-KR");
    }
}

setInterval(updateIconicHeartCount, 1000);
updateIconicHeartCount();

/* =========================
   TODAY SCHEDULE
   ========================= */

const todaySchedule = document.getElementById("today-schedule");

const todayObj = new Date();
const yyyy = todayObj.getFullYear();
const mm = String(todayObj.getMonth() + 1).padStart(2, "0");
const dd = String(todayObj.getDate()).padStart(2, "0");

const todayKey = `${yyyy}-${mm}-${dd}`;
const scheduleFile = `./schedule-${yyyy}.json`;

fetch(scheduleFile)
    .then(res => {
        if (!res.ok) {
            throw new Error(`${scheduleFile} 로드 실패`);
        }

        return res.json();
    })
    .then(scheduleData => {
        if (scheduleData && scheduleData[todayKey]) {
            todaySchedule.innerHTML =
                scheduleData[todayKey].replace(/\n/g, "<br>");
        } else {
            todaySchedule.textContent = "오늘 일정이 없습니다.";
        }
    })
    .catch(() => {
        todaySchedule.textContent = "오늘 일정이 없습니다.";
    });
