<style>
/* 모바일 앱 전용 기본 설정 및 새로고침(Pull-to-Refresh) 방지 */
html {
    overscroll-behavior-y: none;
    -webkit-tap-highlight-color: transparent;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo",sans-serif;
    background:#f5f6f8;
    color:#222;
    overscroll-behavior-y: none;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
}

.container{
    max-width:420px;
    margin:0 auto;
    padding:24px 16px 70px;
    box-sizing: border-box;
}

.header{
    margin-bottom:24px;
}


/* =========================================================
   DDAY
   ========================================================= */

#dday-container{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    overflow:hidden;
}

#dday-box{
    flex:1;
    text-align:center;
    padding:6px 0;
    touch-action:pan-y;
    user-select:none;
}

#dday-box.slide-out-left{
    animation:ddaySlideOutLeft .4s ease forwards;
}

#dday-box.slide-out-right{
    animation:ddaySlideOutRight .4s ease forwards;
}

#dday-box.slide-in-left{
    animation:ddaySlideInLeft .4s ease forwards;
}

#dday-box.slide-in-right{
    animation:ddaySlideInRight .4s ease forwards;
}

@keyframes ddaySlideOutLeft{
    from{
        opacity:1;
        transform:translateX(0);
    }
    to{
        opacity:0;
        transform:translateX(-30px);
    }
}

@keyframes ddaySlideOutRight{
    from{
        opacity:1;
        transform:translateX(0);
    }
    to{
        opacity:0;
        transform:translateX(30px);
    }
}

@keyframes ddaySlideInLeft{
    from{
        opacity:0;
        transform:translateX(30px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

@keyframes ddaySlideInRight{
    from{
        opacity:0;
        transform:translateX(-30px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

#dday-text{
    font-size:1.1rem;
    font-weight:800;
}

#dday-label{
    font-size:1.6rem;
    font-weight:900;
}


/* =========================================================
   DDAY INDICATOR
   ========================================================= */

#dday-indicator{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:5px;
    margin-top:5px;
    margin-bottom:5px;
}

.dday-dot{
    font-size:8px;
    line-height:1;
    color:#d5d5d5;
    transition:color .25s ease, transform .25s ease;
}

.dday-dot.active{
    color:#89CFF0;
    transform:scale(1.15);
}


/* =========================================================
   GRID
   ========================================================= */

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.card{
    background:white;
    border:none;
    border-radius:18px;
    padding:22px 12px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:transform 0.1s ease;
}

.card:active {
    transform:scale(0.98);
}

.wide{
    grid-column:1 / -1;
}


/* =========================================================
   TODO / MISSION
   ========================================================= */

.todo-section{
    margin:25px 0 25px;
}

.todo-box{
    background:white;
    border-radius:18px;
    padding:18px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    line-height:2;
}

.todo-header{
    font-size:1rem;
    font-weight:700;
    margin-bottom:10px;
    padding-bottom:10px;
    border-bottom:1px solid #eee;
}

.mission-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin:8px 0;
}

.mission-btn{
    background:#222;
    color:#fff;
    text-decoration:none;
    padding:5px 12px;
    border-radius:999px;
    font-size:.8rem;
    font-weight:600;
    white-space:nowrap;
}


/* =========================================================
   COPYRIGHT
   ========================================================= */

.copyright{
    margin-top:16px;
    font-size:0.75rem;
    line-height:1.6;
    color:#777;
    text-align:center;
}


/* =========================================================
   OFFICIAL ACCOUNTS
   ========================================================= */

.sns-section{
    margin-top:20px;
    text-align:center;
}

.sns-icons{
    display:flex;
    justify-content:center;
    gap:18px;
    margin-top:14px;
}

.sns-icons a img{
    width:34px;
    height:34px;
    display:block;
}


/* =========================================================
   MV SWIPER
   ========================================================= */

.mvSwiper{
    width:100%;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.mvSwiper iframe{
    width:100%;
    height:220px;
    border:0;
    display:block;
}

.swiper-pagination{
    position:relative;
    margin-top:10px;
}


/* =========================================================
   KST SYNC MINI PLAYER
   ========================================================= */

.kst-player{
    position:fixed;

    right:12px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));

    width:158px;
    min-height:48px;

    background:rgba(255,255,255,.96);

    border:1px solid rgba(137,207,240,.45);
    border-radius:14px;

    box-shadow:0 4px 14px rgba(0,0,0,.10);

    display:flex;
    align-items:center;

    padding:7px 9px;

    box-sizing:border-box;

    z-index:9999;

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.kst-player.scrolling{
    opacity:.28;
    transform:translateX(2px);
}

.kst-player-info{
    min-width:0;
    width:100%;
    overflow:hidden;
}

.kst-player-song{
    display:flex;
    align-items:center;
    gap:6px;
    min-width:0;
}

.kst-player-title{
    min-width:0;

    font-size:12px;
    font-weight:700;

    line-height:15px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    color:#222;
}

.kst-player-number{
    font-size:8px;
    font-weight:600;

    color:#89CFF0;

    white-space:nowrap;
    flex-shrink:0;
}

.kst-player-time{
    font-size:10px;
    color:#888;
    line-height:13px;
}

.kst-player-progress{
    width:100%;
    height:2px;

    margin-top:2px;

    background:#e5e5e5;

    border-radius:999px;

    overflow:hidden;
}

.kst-player-progress-bar{
    width:0%;
    height:100%;

    background:#89CFF0;

    transition:width .5s linear;
}

@media(max-width:360px){
    .kst-player{
        width:148px;
        right:8px;
    }
}
</style>
</head>

<script>

/* =========================================================
   MISSION
   ========================================================= */

function toKSTDate(str){
    return new Date(str + "T00:00:00+09:00");
}

const mission = document.getElementById("mission-list");

const schedules = [
    {
        start:"2026-10-06",
        end:"2026-10-19",
        items:[
            {
                text:"🗳KGMA Berriz Global Fans' Choice 투표하기",
                link:"https://link.berriz.in/ko/web/main/vote/2026kgma"
            }
        ]
    },
    {
        start:"2026-10-12",
        end:"2026-10-22",
        items:[
            {
                text:"🗳MAMA FANS' CHOICE 1차 투표하기",
                link:"https://mnetplus.world/event/2026-mama?deeplink=mnetplus%3A%2F%2Fvote%2Ftemplates%2Fmama-fans-choice-vote-r1%2F6ab09532c314bb17315adc4e%3Furl_fallback_type%3Dupdate&missionType=MAMA_2026_FANS_CHOICE_VOTE_1ST_SHARE&refererCode=69Z57YA7"
            }
        ]
    },
    {
        start:"2026-10-15",
        end:"2026-10-29",
        items:[
            {
                text:"🗳MMA TOP10 투표하기",
                link:"https://m2.melon.com/mma/2026/vote/top10/"
            }
        ]
    },
    {
        start:"2026-10-08",
        end:"2026-11-04",
        items:[
            {
                text:"🗳AAA 인기상 여자그룹 투표하기",
                link:"https://promo-web.idolchamp.com/app_proxy.html?deeplink=https%3A%2F%2Fapp.idolchamp.com%2Fopen%2Fvote%2F01M4784X9DKK87B0J1GB669P3R"
            }
        ]
    }
];

const now = new Date();
let currentMission = [];

for(const s of schedules){
    const start = toKSTDate(s.start);
    const end = toKSTDate(s.end);
    end.setHours(23, 59, 59, 999);

    if(now >= start && now <= end){
        currentMission.push(...s.items);
    }
}

mission.innerHTML = currentMission.length
    ? currentMission.map(item => {
        if(typeof item === "string"){
            return `<div>✅ ${item}</div>`;
        }
        return `
            <div class="mission-row">
                <span>✅ ${item.text}</span>
                <a class="mission-btn" href="${item.link}" target="_blank">바로가기</a>
            </div>
        `;
    }).join("")
    : "진행 중인 미션이 없습니다.";


/* =========================================================
   DDAY
   ========================================================= */

const ddayList = [
    {
        name:"👾 주은 생일",
        date:"2026-12-03T00:00:00+09:00",
        type:"dday"
    },
    {
        name:"🌻 에이나 생일",
        date:"2026-12-20T00:00:00+09:00",
        type:"dday"
    },
    {
        name:"🎉 데뷔",
        date:"2025-02-24T00:00:00+09:00",
        type:"debut"
    }
];

let ddayIndex = 0;
const ddayBox = document.getElementById("dday-box");
const ddayText = document.getElementById("dday-text");
const ddayLabel = document.getElementById("dday-label");
const ddayIndicator = document.getElementById("dday-indicator");

ddayIndicator.innerHTML = ddayList.map((item,index) => `
    <span class="dday-dot ${index === 0 ? "active" : ""}" data-index="${index}">●</span>
`).join("");

function updateDdayIndicator(){
    const dots = ddayIndicator.querySelectorAll(".dday-dot");
    dots.forEach((dot,index) => {
        dot.classList.toggle("active", index === ddayIndex);
    });
}

function updateDday(){
    const item = ddayList[ddayIndex];
    const nowDate = new Date();
    const target = new Date(item.date);

    ddayText.textContent = item.name;

    const diff = target - nowDate;
    const day = Math.ceil(diff / (1000 * 60 * 60 * 24));

    if(item.type === "debut"){
        const start = new Date(2025, 1, 24);
        const todayDate = new Date(nowDate.getFullYear(), nowDate.getMonth(), nowDate.getDate());
        const diffDays = Math.floor((todayDate - start) / (1000 * 60 * 60 * 24)) + 1;
        ddayLabel.textContent = `D+${diffDays}`;
        updateDdayIndicator();
        return;
    }

    if(diff > 0){
        ddayLabel.textContent = `D-${day}`;
    }else{
        ddayLabel.textContent = "D-DAY";
    }

    updateDdayIndicator();
}


/* =========================================================
   DDAY SLIDE
   ========================================================= */

let ddayAnimating = false;
let ddayTimer;

function resetDdayTimer(){
    clearTimeout(ddayTimer);
    ddayTimer = setTimeout(function(){
        moveDday(1);
    }, 10000);
}

function moveDday(dir = 1){
    if(ddayAnimating) return;

    ddayAnimating = true;
    clearTimeout(ddayTimer);

    ddayBox.classList.remove("slide-in-left", "slide-in-right", "slide-out-left", "slide-out-right");

    if(dir > 0){
        ddayBox.classList.add("slide-out-left");
    }else{
        ddayBox.classList.add("slide-out-right");
    }

    setTimeout(function(){
        ddayIndex += dir;

        if(ddayIndex < 0){
            ddayIndex = ddayList.length - 1;
        }
        if(ddayIndex >= ddayList.length){
            ddayIndex = 0;
        }

        updateDday();

        ddayBox.classList.remove("slide-out-left", "slide-out-right");

        if(dir > 0){
            ddayBox.classList.add("slide-in-left");
        }else{
            ddayBox.classList.add("slide-in-right");
        }

        setTimeout(function(){
            ddayBox.classList.remove("slide-in-left", "slide-in-right");
            ddayAnimating = false;
            resetDdayTimer();
        }, 400);

    }, 400);
}

updateDday();
resetDdayTimer();


/* =========================================================
   DDAY SWIPE
   ========================================================= */

let ddayTouchStartX = 0;
let ddayTouchStartY = 0;

ddayBox.addEventListener("touchstart", function(e){
    ddayTouchStartX = e.touches[0].clientX;
    ddayTouchStartY = e.touches[0].clientY;
}, { passive:true });

ddayBox.addEventListener("touchend", function(e){
    const ddayTouchEndX = e.changedTouches[0].clientX;
    const ddayTouchEndY = e.changedTouches[0].clientY;

    const swipeDistanceX = ddayTouchEndX - ddayTouchStartX;
    const swipeDistanceY = ddayTouchEndY - ddayTouchStartY;

    if(Math.abs(swipeDistanceX) > Math.abs(swipeDistanceY)){
        if(swipeDistanceX > 50){
            moveDday(-1);
        } else if(swipeDistanceX < -50){
            moveDday(1);
        }
    }
}, { passive:true });


/* =========================================================
   KST SYNC PLAYLIST
   ========================================================= */

const kstStartTime = new Date("2026-10-05T18:30:00+09:00");
const kstStartIndex = 16; // 17번 곡 = index 16

const kstPlaylist = [
    { title:"Lemon Tang", duration:163 },
    { title:"ICONIC HEART (Korean.ver)", duration:189 },
    { title:"RUDE!", duration:200 },
    { title:"FOCUS", duration:178 },
    { title:"Moonride", duration:177 },
    { title:"Lemon Tang", duration:163 },
    { title:"ICONIC HEART (Japanese.ver)", duration:189 },
    { title:"RUDE!", duration:200 },
    { title:"STYLE", duration:210 },
    { title:"15-LOVE", duration:155 },
    { title:"Lemon Tang", duration:163 },
    { title:"ICONIC HEART (Korean.ver)", duration:189 },
    { title:"RUDE!", duration:200 },
    { title:"FOCUS", duration:178 },
    { title:"ICONIC HEART (Japanese.ver)", duration:189 },
    { title:"Lemon Tang", duration:163 },
    { title:"ICONIC HEART (Korean.ver)", duration:189 },
    { title:"RUDE!", duration:200 },
    { title:"STYLE", duration:210 }
];

const kstTotalDuration = kstPlaylist.reduce((total,song) => total + song.duration, 0);
const kstStartOffset = kstPlaylist.slice(0, kstStartIndex).reduce((total, song) => total + song.duration, 0);

const kstPlayerTitle = document.getElementById("kst-player-title");
const kstPlayerNumber = document.getElementById("kst-player-number");
const kstPlayerTime = document.getElementById("kst-player-time");
const kstPlayerProgress = document.getElementById("kst-player-progress-bar");

function formatKstTime(seconds){
    seconds = Math.max(0, Math.floor(seconds));
    const minutes = Math.floor(seconds / 60);
    const remaining = seconds % 60;
    return minutes + ":" + String(remaining).padStart(2, "0");
}

function getKstPlayerPosition(){
    const nowMs = Date.now();
    const startMs = kstStartTime.getTime();

    if(nowMs < startMs){
        return { index:kstStartIndex, position:0 };
    }

    const elapsed = Math.floor((nowMs - startMs) / 1000);
    const cyclePosition = (kstStartOffset + elapsed) % kstTotalDuration;

    let accumulated = 0;
    for(let i = 0; i < kstPlaylist.length; i++){
        const song = kstPlaylist[i];
        const songEnd = accumulated + song.duration;
        if(cyclePosition < songEnd){
            return { index:i, position:cyclePosition - accumulated };
        }
        accumulated = songEnd;
    }
    return { index:kstStartIndex, position:0 };
}

function updateKstPlayer(){
    const current = getKstPlayerPosition();
    const song = kstPlaylist[current.index];
    const position = current.position;

    kstPlayerTitle.textContent = song.title;
    kstPlayerNumber.textContent = `${current.index + 1} / ${kstPlaylist.length}`;
    kstPlayerTime.textContent = formatKstTime(position) + " / " + formatKstTime(song.duration);

    const progress = (position / song.duration) * 100;
    kstPlayerProgress.style.width = Math.min(100, Math.max(0, progress)) + "%";
}

setInterval(updateKstPlayer, 1000);
updateKstPlayer();


/* =========================================================
   ICONIC HEART COUNTER
   ========================================================= */

const iconicHeartCompletionOffsets = [189, 951, 2775];

function getIconicHeartCount(){
    const nowMs = Date.now();
    const startMs = kstStartTime.getTime();

    if(nowMs < startMs) return 0;

    const elapsed = Math.floor((nowMs - startMs) / 1000);
    const completedCycles = Math.floor(elapsed / kstTotalDuration);
    const currentCyclePosition = elapsed % kstTotalDuration;

    let count = completedCycles * 3;
    for(const offset of iconicHeartCompletionOffsets){
        if(currentCyclePosition >= offset){
            count++;
        }
    }
    return count;
}

function updateIconicHeartCount(){
    const el = document.getElementById("iconic-heart-count");
    if(el) el.textContent = getIconicHeartCount();
}

setInterval(updateIconicHeartCount, 1000);
updateIconicHeartCount();

const todaySchedule = document.getElementById("today-schedule");
const todayObj = new Date();
const yyyy = todayObj.getFullYear();
const mm = String(todayObj.getMonth() + 1).padStart(2, "0");
const dd = String(todayObj.getDate()).padStart(2, "0");
const todayKey = `${yyyy}-${mm}-${dd}`;
const scheduleFile = `./schedule-${yyyy}.json`;

fetch(scheduleFile)
    .then(res => {
        if(!res.ok) throw new Error(`${scheduleFile} 로드 실패`);
        return res.json();
    })
    .then(scheduleData => {
        if(scheduleData && scheduleData[todayKey]){
            todaySchedule.innerHTML = scheduleData[todayKey].replace(/\n/g, "<br>");
        }else{
            todaySchedule.innerHTML = "오늘 일정이 없습니다.";
        }
    })
    .catch(() => {
        todaySchedule.innerHTML = "오늘 일정이 없습니다.";
    });
