<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f6f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #222;
}

.container {
    max-width: 420px;
    margin: 0 auto;
    padding: 24px 16px calc(90px + env(safe-area-inset-bottom, 0px));
}

.back-btn {
    display: inline-block;
    text-decoration: none;
    color: #222;
    font-size: 1.5rem;
    margin-bottom: 20px;
}

.stream-title {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 12px;
}

.stream-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 20px;
}

.stream-box {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 56px;
    background: #fff;
    border-radius: 14px;
    text-decoration: none;
    color: #222;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
    transition: transform .15s;
}

.stream-box:active {
    transform: scale(.97);
}

.image {
    width: 100%;
    display: block;
    border-radius: 18px;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
}

/* =========================
   FIXED BOTTOM NAVIGATION
   ========================= */

.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 9000;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    background: rgba(255, 255, 255, .97);
    border-top: 1px solid #e8e8e8;
    box-shadow: 0 -3px 14px rgba(0, 0, 0, .06);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.bottom-nav a {
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 42px;
    padding: 0 2px;
    color: #777;
    text-decoration: none;
    font-size: .75rem;
    font-weight: 600;
    white-space: nowrap;
}

.bottom-nav a.active {
    color: #222;
    font-weight: 800;
    position: relative;
}

.bottom-nav a.active::before {
    content: "";
    position: absolute;
    top: -6px;
    left: 28%;
    right: 28%;
    height: 3px;
    border-radius: 4px;
    background: #89CFF0;
}

@media (max-width: 360px) {
    .bottom-nav a {
        font-size: .68rem;
    }
}
</style>
</head>
