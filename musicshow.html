<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>음방 직캠 | H2HCHIVE</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f6f8;
    color:#222;
}

.content{
    width:100%;
    min-height:100vh;
}

.content-inner{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:24px 16px 40px;
}

/* =========================
   제목
========================= */

.main-title{
    margin-bottom:14px;
    padding-bottom:10px;
    border-bottom:1px solid #ddd;
}

.main-title h1{
    display:inline-block;
    position:relative;
    margin:0;
    padding:0 0 10px;
    font-size:1.1rem;
    font-weight:700;
}

.main-title h1::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:-11px;
    height:2px;
    background:#89CFF0;
}

/* =========================
   유형 필터
========================= */

.type-list,
.sub-category-list{
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:126px;
    overflow-y:auto;
    margin-bottom:16px;
    padding:8px;
    background:#fff;
    border:1px solid #e5e5e5;
    border-radius:10px;
    scrollbar-width:thin;
    scrollbar-color:#d5d5d5 transparent;
}

.type-list::-webkit-scrollbar,
.sub-category-list::-webkit-scrollbar{
    width:4px;
}

.type-list::-webkit-scrollbar-track,
.sub-category-list::-webkit-scrollbar-track{
    background:transparent;
}

.type-list::-webkit-scrollbar-thumb,
.sub-category-list::-webkit-scrollbar-thumb{
    background:#d5d5d5;
    border-radius:999px;
}

.type-button,
.sub-category-button{
    flex-shrink:0;
    padding:8px 10px;
    border:0;
    border-radius:8px;
    background:#fff;
    color:#666;
    font-family:inherit;
    font-size:.75rem;
    text-align:left;
    cursor:pointer;
}

.type-button:hover,
.sub-category-button:hover{
    background:#f5f6f8;
}

.type-button.active,
.sub-category-button.active{
    background:#eaf7fd;
    color:#4aa8d5;
    font-weight:600;
}

/* =========================
   하위 필터
========================= */

.sub-category-list{
    display:none;
}

.sub-category-list.show{
    display:flex;
}

/* =========================
   날짜 검색
========================= */

.search-area{
    margin-bottom:8px;
}

#dateSearch{
    display:block;
    width:100%;
    min-width:0;
    padding:11px;
    border:1px solid #ddd;
    border-radius:9px;
    background:#fff;
    color:#222;
    font-family:inherit;
    font-size:16px;
    outline:none;
}

#dateSearch:focus{
    border-color:#89CFF0;
}

#dateSearch::placeholder{
    color:#aaa;
    font-size:.8rem;
}

/* =========================
   정렬
========================= */

.sort-area{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    margin-bottom:16px;
    white-space:nowrap;
}

.sort-button{
    padding:6px 0;
    border:0;
    background:transparent;
    color:#aaa;
    font-family:inherit;
    font-size:.75rem;
    cursor:pointer;
}

.sort-button.active{
    color:#4aa8d5;
    font-weight:600;
}

.sort-divider{
    margin:0 6px;
    color:#ddd;
    font-size:.75rem;
}

/* =========================
   영상 그리드
========================= */

.video-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    align-items:start;
    gap:10px;
}

/* =========================
   영상 카드
========================= */

.video-card{
    display:block;
    min-width:0;
    overflow:hidden;
    background:#fff;
    border-radius:13px;
    text-decoration:none;
    color:#222;
    box-shadow:0 2px 7px rgba(0,0,0,.05);
    -webkit-tap-highlight-color:transparent;
}

.video-card:active{
    transform:scale(.985);
}

/* =========================
   썸네일
========================= */

.video-thumbnail{
    display:block;
    width:100%;
    aspect-ratio:16 / 9;
    object-fit:cover;
    background:#eee;
}

/* =========================
   영상 정보
========================= */

.video-info{
    min-width:0;
    padding:10px 11px 12px;
    overflow:hidden;
}

/* 방송사 / 멤버 */

.video-broadcaster{
    margin-bottom:5px;
    color:#70b9d8;
    font-size:.65rem;
    font-weight:700;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* 앨범 / 보조 정보 */

.video-album{
    margin-bottom:4px;
    color:#777;
    font-size:.68rem;
    font-weight:400;
    line-height:1.35;
    overflow-wrap:anywhere;
}

/* 영상 제목 */

.video-title{
    margin-bottom:5px;
    font-size:.78rem;
    font-weight:700;
    line-height:1.4;
    overflow-wrap:anywhere;
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;
    overflow:hidden;
}

/* 날짜 */

.video-date{
    color:#999;
    font-size:.68rem;
    font-weight:400;
}

/* =========================
   결과 없음 / 오류
========================= */

.empty{
    grid-column:1 / -1;
    padding:45px 10px;
    color:#999;
    font-size:.8rem;
    line-height:1.6;
    text-align:center;
}

/* =========================
   모바일
========================= */

@media(hover:hover) and (pointer:fine){
    .video-card:hover{
        box-shadow:0 4px 10px rgba(0,0,0,.07);
    }
}

@media(max-width:360px){

    .content-inner{
        padding-left:12px;
        padding-right:12px;
    }

    .video-grid{
        gap:8px;
    }

    .video-info{
        padding:8px 9px 10px;
    }

    .video-broadcaster{
        font-size:.62rem;
    }

    .video-album{
        font-size:.64rem;
    }

    .video-title{
        font-size:.74rem;
    }

    .video-date{
        font-size:.65rem;
    }
}
</style>
</head>

<body>

<main class="content">
<div class="content-inner">

    <!-- 제목 -->
    <div class="main-title">
        <h1>음방 직캠</h1>
    </div>

    <!-- 직캠 유형 -->
    <div class="type-list">

        <button
            type="button"
            class="type-button active"
            data-type="all"
            onclick="showType('all')"
        >전체</button>

        <button
            type="button"
            class="type-button"
            data-type="group"
            onclick="showType('group')"
        >그룹 직캠</button>

        <button
            type="button"
            class="type-button"
            data-type="member"
            onclick="showType('member')"
        >멤버 직캠</button>

        <button
            type="button"
            class="type-button"
            data-type="etc"
            onclick="showType('etc')"
        >기타</button>

    </div>

    <!-- 앨범 필터 -->
    <div id="albumFilters" class="sub-category-list">

        <button type="button" class="sub-category-button"
            data-album="all" onclick="showAlbum('all')">전체 앨범</button>

        <button type="button" class="sub-category-button"
            data-album="The Chase" onclick="showAlbum('The Chase')">The Chase</button>

        <button type="button" class="sub-category-button"
            data-album="STYLE" onclick="showAlbum('STYLE')">STYLE</button>

        <button type="button" class="sub-category-button"
            data-album="Pretty Please" onclick="showAlbum('Pretty Please')">Pretty Please</button>

        <button type="button" class="sub-category-button"
            data-album="FOCUS" onclick="showAlbum('FOCUS')">FOCUS</button>

        <button type="button" class="sub-category-button"
            data-album="RUDE!" onclick="showAlbum('RUDE!')">RUDE!</button>

        <button type="button" class="sub-category-button"
            data-album="Lemon Tang" onclick="showAlbum('Lemon Tang')">Lemon Tang</button>

        <button type="button" class="sub-category-button"
            data-album="15-LOVE" onclick="showAlbum('15-LOVE')">15-LOVE</button>

        <button type="button" class="sub-category-button"
            data-album="ICONIC HEART(Korean Ver.)"
            onclick="showAlbum('ICONIC HEART(Korean Ver.)')">
            ICONIC HEART(Korean Ver.)
        </button>

    </div>

    <!-- 멤버 필터 -->
    <div id="memberFilters" class="sub-category-list">

        <button type="button" class="sub-category-button"
            data-member="all" onclick="showMember('all')">전체 멤버</button>

        <button type="button" class="sub-category-button"
            data-member="지우" onclick="showMember('지우')">지우</button>

        <button type="button" class="sub-category-button"
            data-member="카르멘" onclick="showMember('카르멘')">카르멘</button>

        <button type="button" class="sub-category-button"
            data-member="유하" onclick="showMember('유하')">유하</button>

        <button type="button" class="sub-category-button"
            data-member="스텔라" onclick="showMember('스텔라')">스텔라</button>

        <button type="button" class="sub-category-button"
            data-member="주은" onclick="showMember('주은')">주은</button>

        <button type="button" class="sub-category-button"
            data-member="에이나" onclick="showMember('에이나')">에이나</button>

        <button type="button" class="sub-category-button"
            data-member="이안" onclick="showMember('이안')">이안</button>

        <button type="button" class="sub-category-button"
            data-member="예온" onclick="showMember('예온')">예온</button>

    </div>

    <!-- 날짜 검색 -->
    <div class="search-area">
        <input
            id="dateSearch"
            type="text"
            placeholder="날짜 검색 · 예: 250224"
            aria-label="날짜 검색"
            oninput="searchByDate()"
        >
    </div>

    <!-- 정렬 -->
    <div class="sort-area">

        <button
            type="button"
            class="sort-button active"
            data-sort="newest"
            onclick="changeSort('newest')"
        >최신순</button>

        <span class="sort-divider">|</span>

        <button
            type="button"
            class="sort-button"
            data-sort="oldest"
            onclick="changeSort('oldest')"
        >오래된순</button>

    </div>

    <!-- 영상 목록 -->
    <div class="video-grid" id="videoGrid" aria-live="polite">
        <div class="empty">영상을 불러오는 중입니다.</div>
    </div>

</div>
</main>

<script>
/* =========================
   JSON 설정
========================= */

const DATA_FILES = {
    group: "video.json",

    members: {
        "지우": "jiwoo.json",
        "카르멘": "carmen.json",
        "유하": "yuha.json",
        "스텔라": "stella.json",
        "주은": "jueun.json",
        "에이나": "aina.json",
        "이안": "ian.json",
        "예온": "yeon.json"
    },

    etc: "etc.json"
};

/* =========================
   상태
========================= */

let groupVideos = [];
let memberVideos = [];
let etcVideos = [];

let currentType = "all";
let currentAlbum = "all";
let currentMember = "all";
let currentDate = "";
let currentSort = "newest";

/* =========================
   HTML 특수문자 처리
========================= */

function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* =========================
   영상 ID 처리
========================= */

function getVideoId(value){

    if(!value){
        return "";
    }

    value = String(value).trim();

    if(
        !value.includes("/") &&
        !value.includes("?") &&
        !value.includes("=")
    ){
        return value;
    }

    try{
        const url = new URL(value);

        if(url.hostname.includes("youtu.be")){
            return url.pathname.split("/").filter(Boolean)[0] || "";
        }

        if(url.searchParams.get("v")){
            return url.searchParams.get("v");
        }

        const embedMatch = url.pathname.match(/\/(?:embed|shorts)\/([^/]+)/);

        if(embedMatch){
            return embedMatch[1];
        }
    }catch(error){
        // 기존 데이터에 URL 형식이 아닌 값이 있으면 아래에서 처리
    }

    if(value.includes("v=")){
        return value.split("v=")[1].split("&")[0];
    }

    if(value.includes("youtu.be/")){
        return value.split("youtu.be/")[1].split(/[?&]/)[0];
    }

    return value;
}

/* =========================
   앨범 자동 매칭
========================= */

function getAlbumByDate(date){

    if(!date){
        return "";
    }

    const matchedVideo = groupVideos.find(video =>
        video.date === date && video.album
    );

    return matchedVideo ? matchedVideo.album : "";
}

/* =========================
   카드 생성
========================= */

function createVideoCard(video){

    const card = document.createElement("a");
    const videoId = getVideoId(video.videoId);

    card.className = "video-card";

    if(videoId){
        card.href = `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
    }else{
        card.href = "#";
        card.addEventListener("click", event => event.preventDefault());
    }

    const thumbnail = document.createElement("img");
    thumbnail.className = "video-thumbnail";
    thumbnail.loading = "lazy";
    thumbnail.alt = video.title || "영상 썸네일";

    if(videoId){
        thumbnail.src =
            `https://img.youtube.com/vi/${encodeURIComponent(videoId)}/hqdefault.jpg`;
    }

    thumbnail.onerror = function(){
        this.style.visibility = "hidden";
    };

    const info = document.createElement("div");
    info.className = "video-info";

    function addInfo(className, value){

        if(value === undefined || value === null || String(value).trim() === ""){
            return;
        }

        const element = document.createElement("div");
        element.className = className;
        element.textContent = value;
        info.appendChild(element);
    }

    if(video.dataType === "group"){

        addInfo("video-broadcaster", video.broadcaster);

        addInfo(
            "video-album",
            video.album || getAlbumByDate(video.date)
        );

        const titleParts = [video.program, video.type].filter(Boolean);
        addInfo("video-title", titleParts.join(" "));

        addInfo("video-date", video.date);
    }

    else if(video.dataType === "member"){

        addInfo("video-broadcaster", video.member);

        if(video.content){

            addInfo("video-album", video.title);
            addInfo("video-title", video.content);

        }else{

            addInfo("video-album", video.album);
            addInfo("video-title", video.title);

        }

        addInfo("video-date", video.date);
    }

    else if(video.dataType === "etc"){

        addInfo("video-broadcaster", video.broadcaster);
        addInfo("video-title", video.program);
        addInfo("video-album", video.title);
        addInfo("video-date", video.date);
    }

    card.appendChild(thumbnail);
    card.appendChild(info);

    return card;
}

/* =========================
   영상 렌더링
========================= */

function renderVideos(videos){

    const grid = document.getElementById("videoGrid");
    grid.replaceChildren();

    if(videos.length === 0){

        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "해당하는 직캠이 없습니다.";

        grid.appendChild(empty);
        return;
    }

    const fragment = document.createDocumentFragment();

    videos.forEach(video => {
        fragment.appendChild(createVideoCard(video));
    });

    grid.appendChild(fragment);
}

/* =========================
   날짜 필터
========================= */

function filterByDate(videos){

    if(currentDate === ""){
        return videos;
    }

    return videos.filter(video => {

        const compactDate = String(video.date || "")
            .replace(/-/g, "")
            .replace(/\./g, "")
            .replace(/\//g, "");

        return compactDate.includes(currentDate);
    });
}

/* =========================
   날짜 정렬
========================= */

function sortByDate(videos){

    return videos.sort((a,b) => {

        const dateA = String(a.date || "");
        const dateB = String(b.date || "");

        if(dateA === dateB){
            return 0;
        }

        if(currentSort === "oldest"){
            return dateA.localeCompare(dateB);
        }

        return dateB.localeCompare(dateA);
    });
}

/* =========================
   필터 적용
========================= */

function applyFilters(){

    let filtered = [];

    if(currentType === "all"){

        filtered = [
            ...groupVideos,
            ...memberVideos,
            ...etcVideos
        ];

    }else if(currentType === "group"){

        filtered = [...groupVideos];

    }else if(currentType === "member"){

        filtered = [...memberVideos];

    }else if(currentType === "etc"){

        filtered = [...etcVideos];

    }

    /* 그룹 앨범 */

    if(currentType === "group" && currentAlbum !== "all"){

        filtered = filtered.filter(video => {

            const album = video.album || getAlbumByDate(video.date);

            return album === currentAlbum;
        });

    }

    /* 멤버 */

    if(currentType === "member" && currentMember !== "all"){

        filtered = filtered.filter(video =>
            video.member === currentMember
        );

    }

    filtered = filterByDate(filtered);
    filtered = sortByDate(filtered);

    renderVideos(filtered);
}

/* =========================
   유형 버튼 상태
========================= */

function updateTypeButtons(){

    document.querySelectorAll(".type-button").forEach(button => {

        button.classList.toggle(
            "active",
            button.dataset.type === currentType
        );

    });
}

/* =========================
   하위 필터 표시
========================= */

function updateFilterVisibility(){

    document.getElementById("albumFilters")
        .classList.toggle("show", currentType === "group");

    document.getElementById("memberFilters")
        .classList.toggle("show", currentType === "member");
}

/* =========================
   앨범 버튼 상태
========================= */

function updateAlbumButtons(){

    document.querySelectorAll("#albumFilters .sub-category-button")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.album === currentAlbum
            );

        });
}

/* =========================
   멤버 버튼 상태
========================= */

function updateMemberButtons(){

    document.querySelectorAll("#memberFilters .sub-category-button")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.member === currentMember
            );

        });
}

/* =========================
   유형 선택
========================= */

function showType(type){

    currentType = type;
    currentAlbum = "all";
    currentMember = "all";

    updateTypeButtons();
    updateFilterVisibility();
    updateAlbumButtons();
    updateMemberButtons();

    applyFilters();
}

/* =========================
   앨범 선택
========================= */

function showAlbum(album){

    currentType = "group";
    currentAlbum = album;
    currentMember = "all";

    updateTypeButtons();
    updateFilterVisibility();
    updateAlbumButtons();
    updateMemberButtons();

    applyFilters();
}

/* =========================
   멤버 선택
========================= */

function showMember(member){

    currentType = "member";
    currentMember = member;
    currentAlbum = "all";

    updateTypeButtons();
    updateFilterVisibility();
    updateAlbumButtons();
    updateMemberButtons();

    applyFilters();
}

/* =========================
   날짜 검색
========================= */

function searchByDate(){

    currentDate = document
        .getElementById("dateSearch")
        .value
        .trim()
        .replace(/[-./\s]/g, "");

    applyFilters();
}

/* =========================
   정렬
========================= */

function changeSort(sort){

    currentSort = sort;

    document.querySelectorAll(".sort-button").forEach(button => {

        button.classList.toggle(
            "active",
            button.dataset.sort === currentSort
        );

    });

    applyFilters();
}

/* =========================
   JSON 불러오기
========================= */

async function loadJSON(url){

    const response = await fetch(url);

    if(!response.ok){
        throw new Error(`${url} HTTP ${response.status}`);
    }

    const data = await response.json();

    if(!Array.isArray(data)){
        throw new Error(`${url} 데이터가 배열 형식이 아닙니다.`);
    }

    return data;
}

/* =========================
   전체 영상 불러오기
========================= */

async function loadVideos(){

    const grid = document.getElementById("videoGrid");

    try{

        const groupPromise = loadJSON(DATA_FILES.group);

        const memberEntries = Object.entries(DATA_FILES.members);

        const memberPromises = memberEntries.map(([member,file]) =>
            loadJSON(file).then(videos => ({
                member,
                videos
            }))
        );

        const etcPromise = loadJSON(DATA_FILES.etc);

        const [
            groupData,
            memberData,
            etcData
        ] = await Promise.all([
            groupPromise,
            Promise.all(memberPromises),
            etcPromise
        ]);

        /* 그룹 영상 */

        groupVideos = groupData.map(video => ({
            ...video,
            videoId: getVideoId(video.videoId),
            dataType: "group"
        }));

        /* 멤버 영상 */

        memberVideos = [];

        memberData.forEach(({member,videos}) => {

            videos.forEach(video => {

                memberVideos.push({
                    ...video,
                    videoId: getVideoId(video.videoId),
                    album: video.album || getAlbumByDate(video.date),
                    member: member,
                    dataType: "member"
                });

            });

        });

        /* 기타 영상 */

        etcVideos = etcData.map(video => ({
            ...video,
            videoId: getVideoId(video.videoId),
            dataType: "etc"
        }));

        applyFilters();

    }catch(error){

        console.error("영상 JSON 불러오기 실패:", error);

        grid.replaceChildren();

        const errorMessage = document.createElement("div");
        errorMessage.className = "empty";
        errorMessage.textContent =
            "영상을 불러오지 못했습니다. JSON 파일과 파일명을 확인해주세요.";

        grid.appendChild(errorMessage);
    }
}
