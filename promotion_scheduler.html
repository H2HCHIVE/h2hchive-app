<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>프로모션 스케줄러 | H2HCHIVE</title>

<style>
:root{
    --bg:#f5f6f8;
    --white:#fff;
    --text:#22252a;
    --muted:#9298a2;
    --line:#e9edf1;
    --blue:#89CFF0;
    --blue-light:#eaf7fd;
    --radius:20px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
                "Noto Sans KR",sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
}

button{
    font:inherit;
}

button:focus-visible{
    outline:3px solid var(--blue);
    outline-offset:3px;
}

.page{
    width:100%;
    max-width:420px;
    min-height:100vh;
    margin:0 auto;
    padding-bottom:30px;
}

/* 상단 */

.top-header{
    padding:28px 16px 0;
}

.page-title{
    font-size:30px;
    line-height:1.3;
    font-weight:850;
    letter-spacing:-1.2px;
}

.page-subtitle{
    margin-top:8px;
    color:var(--muted);
    font-size:12px;
    line-height:1.6;
}

/* 앨범 목록 */

.content{
    padding:30px 16px 20px;
}

.section-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 3px 14px;
}

.section-title{
    font-size:14px;
    font-weight:800;
}

.section-caption{
    color:#9ba1aa;
    font-size:11px;
}

.album-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.album-card{
    display:flex;
    align-items:center;
    width:100%;
    min-height:104px;
    padding:18px;
    border:1px solid rgba(226,231,236,.8);
    border-radius:var(--radius);
    background:var(--white);
    text-align:left;
    cursor:pointer;
    transition:transform .16s ease,border-color .16s ease;
    -webkit-tap-highlight-color:transparent;
}

.album-card:active{
    transform:scale(.985);
    border-color:var(--blue);
}

.album-info{
    flex:1;
    min-width:0;
}

.album-name{
    font-size:17px;
    font-weight:800;
    letter-spacing:-.45px;
    line-height:1.4;
    overflow-wrap:anywhere;
}

.album-date{
    margin-top:7px;
    color:#959ba4;
    font-size:12px;
    font-weight:500;
}

.album-label{
    display:inline-flex;
    align-items:center;
    margin-bottom:7px;
    padding:4px 8px;
    border-radius:6px;
    background:var(--blue-light);
    color:#4387a7;
    font-size:10px;
    font-weight:750;
}

.arrow{
    display:flex;
    flex:0 0 30px;
    align-items:center;
    justify-content:flex-end;
    color:#a8afb8;
    font-size:27px;
    font-weight:300;
}

/* 상세 화면 */

#viewer{
    display:none;
}

.detail-header{
    padding:24px 16px 0;
}

.back-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:40px;
    height:40px;
    margin-bottom:20px;
    border:1px solid var(--line);
    border-radius:13px;
    background:var(--white);
    color:var(--text);
    font-size:22px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

.detail-content{
    padding:0 16px 24px;
}

.albumTitle{
    font-size:29px;
    font-weight:850;
    letter-spacing:-1px;
    line-height:1.3;
    overflow-wrap:anywhere;
}

.detail-subtitle{
    margin-top:8px;
    color:var(--muted);
    font-size:12px;
}

.image-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:26px 3px 13px;
}

.image-heading strong{
    font-size:14px;
    font-weight:800;
}

.imageBox{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.imageBox img{
    display:block;
    width:100%;
    height:auto;
    border:1px solid #e8ecf0;
    border-radius:17px;
    background:var(--white);
}

.image-error{
    padding:22px 15px;
    border:1px dashed #d7dfe6;
    border-radius:15px;
    color:#858c96;
    font-size:12px;
    line-height:1.7;
    text-align:center;
}

/* 하단 안내 */

.footer{
    padding:20px 16px 25px;
    color:#a1a7b0;
    font-size:11px;
    text-align:center;
}

/* 모바일 대응 */

@media(max-width:360px){
    .top-header,
    .detail-header{
        padding-right:14px;
        padding-left:14px;
    }

    .content,
    .detail-content{
        padding-right:14px;
        padding-left:14px;
    }

    .page-title{
        font-size:28px;
    }

    .album-card{
        padding:15px;
    }

    .album-name{
        font-size:16px;
    }
}

@media(prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        scroll-behavior:auto!important;
        transition:none!important;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- 앨범 목록 -->
    <section id="listView">

        <header class="top-header">
            <h1 class="page-title">프로모션 스케줄러</h1>
            <p class="page-subtitle">
                Hearts2Hearts 앨범별 프로모션 일정을 확인하세요.
            </p>
        </header>

        <main class="content">

            <div class="section-heading">
                <h2 class="section-title">앨범 목록</h2>
                <span class="section-caption">총 6개 앨범</span>
            </div>

            <div class="album-list" id="list"></div>

        </main>

        <footer class="footer">
            H2HCHIVE
        </footer>

    </section>

    <!-- 앨범 상세 -->
    <section id="viewer" aria-label="프로모션 스케줄 상세">

        <header class="detail-header">
            <button
                class="back-btn"
                id="backToList"
                type="button"
                aria-label="앨범 목록으로 돌아가기"
            >←</button>
        </header>

        <main class="detail-content">

            <h2 class="albumTitle" id="albumTitle"></h2>

            <div class="detail-subtitle" id="albumDate"></div>

            <div class="image-heading">
                <strong>프로모션 일정</strong>
            </div>

            <div class="imageBox" id="imageBox"></div>

        </main>

        <footer class="footer">
            H2HCHIVE
        </footer>

    </section>

</div>

<script>
const albums = [
    {
        title:"The Chase",
        date:"2025.02.24",
        images:["TheChase-scheduler.jpg"]
    },
    {
        title:"STYLE",
        date:"2025.06.18",
        images:["STYLE-scheduler.jpg"]
    },
    {
        title:"FOCUS",
        date:"2025.10.20",
        images:["FOCUS-scheduler.jpg"]
    },
    {
        title:"RUDE!",
        date:"2026.02.20",
        images:["RUDE-scheduler.jpg"]
    },
    {
        title:"Lemon Tang",
        date:"2026.06.22",
        images:["LemonTang-scheduler.jpg"]
    },
    {
        title:"ICONIC HEART",
        date:"2026.08.12",
        images:["ICONICHEART-scheduler.png"]
    }
];

const list = document.getElementById("list");
const listView = document.getElementById("listView");
const viewer = document.getElementById("viewer");
const albumTitle = document.getElementById("albumTitle");
const albumDate = document.getElementById("albumDate");
const imageBox = document.getElementById("imageBox");

function renderList(){
    list.innerHTML = "";

    albums.forEach((album,index)=>{
        const card = document.createElement("button");
        card.type = "button";
        card.className = "album-card";
        card.setAttribute(
            "aria-label",
            album.title + " 프로모션 일정 보기"
        );

        const info = document.createElement("div");
        info.className = "album-info";

        const label = document.createElement("span");
        label.className = "album-label";
        label.textContent = "PROMOTION";

        const name = document.createElement("h3");
        name.className = "album-name";
        name.textContent = album.title;

        const date = document.createElement("p");
        date.className = "album-date";
        date.textContent = album.date;

        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.setAttribute("aria-hidden","true");
        arrow.textContent = "›";

        info.append(label,name,date);
        card.append(info,arrow);

        card.addEventListener("click",()=>{
            openAlbum(index);
        });

        list.appendChild(card);
    });
}

function openAlbum(index){
    const album = albums[index];

    if(!album) return;

    albumTitle.textContent = album.title;
    albumDate.textContent = "발매일 · " + album.date;
    imageBox.innerHTML = "";

    album.images.forEach(src=>{
        const img = document.createElement("img");
        img.src = src;
        img.alt = album.title + " 프로모션 일정";
        img.loading = "lazy";

        img.addEventListener("error",()=>{
            const error = document.createElement("div");
            error.className = "image-error";
            error.textContent = "이미지를 불러올 수 없습니다. 파일명과 경로를 확인해주세요: " + src;
            img.replaceWith(error);
        },{once:true});

        imageBox.appendChild(img);
    });

    listView.style.display = "none";
    viewer.style.display = "block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function showList(){
    viewer.style.display = "none";
    listView.style.display = "block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

document.getElementById("backToList").addEventListener("click",showList);

renderList();
</script>

</body>
</html>
