<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로모션 스케줄러 | H2HCHIVE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f6f8;
    color: #222;
}

.container {
    max-width: 420px;
    margin: 0 auto;
    padding: 24px 16px calc(90px + env(safe-area-inset-bottom, 0px));
}

/* 뒤로 가기 */
.back-btn {
    display: inline-block;
    text-decoration: none;
    color: #222;
    font-size: 1.5rem;
    line-height: 1;
    margin-bottom: 20px;
    -webkit-tap-highlight-color: transparent;
}

.title {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -1px;
    margin-bottom: 8px;
}

.subtitle {
    color: #888;
    font-size: 0.8rem;
    line-height: 1.6;
    margin-bottom: 24px;
}

/* 앨범 목록 - 2열 */
.album-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
}

.album-card {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 9px;
    background: #fff;
    border: 1px solid #eceef1;
    border-radius: 18px;
    text-align: left;
    color: #222;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s ease;
}

.album-card:active {
    transform: scale(0.98);
}

/* 이미지 미리보기 */
.album-preview {
    width: 100%;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border-radius: 12px;
    background: #edf0f4;
}

.album-preview img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
}

.preview-error {
    display: flex;
    width: 100%;
    height: 100%;
    padding: 10px;
    align-items: center;
    justify-content: center;
    color: #888;
    font-size: 11px;
    text-align: center;
    overflow-wrap: anywhere;
}

.album-info {
    padding: 12px 3px 5px;
}

.album-name {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.45;
    overflow-wrap: anywhere;
}

.album-date {
    margin: 6px 0 0;
    color: #999;
    font-size: 11px;
}

/* 상세 화면 */
#viewer {
    display: none;
}

.detail-title {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1.3;
    overflow-wrap: anywhere;
}

.detail-date {
    margin-top: 8px;
    color: #888;
    font-size: 0.8rem;
}

.detail-heading {
    margin: 28px 0 14px;
    font-size: 1rem;
    font-weight: 700;
}

.image-box {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.image-box img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .06);
}

.image-error {
    padding: 18px;
    border-radius: 12px;
    background: #fff;
    color: #888;
    font-size: 12px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

/* 하단 메뉴 */
.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 9000;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    background: rgba(255, 255, 255, .97);
    border-top: 1px solid #e8e8e8;
    box-shadow: 0 -3px 14px rgba(0, 0, 0, .06);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.bottom-nav a {
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 42px;
    padding: 0 2px;
    color: #777;
    text-decoration: none;
    font-size: .75rem;
    font-weight: 600;
    white-space: nowrap;
}

.bottom-nav a.active {
    color: #222;
    font-weight: 800;
    position: relative;
}

.bottom-nav a.active::before {
    content: "";
    position: absolute;
    top: -6px;
    left: 28%;
    right: 28%;
    height: 3px;
    border-radius: 4px;
    background: #89CFF0;
}

@media (max-width: 360px) {
    .bottom-nav a {
        font-size: .68rem;
    }

    .album-list {
        gap: 10px;
    }

    .album-card {
        padding: 7px;
    }

    .album-name {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- 앨범 목록 -->
    <section id="listView">

        <a href="index.html" class="back-btn" aria-label="홈으로 돌아가기">←</a>

        <div class="title">프로모션 스케줄러</div>
        <p class="subtitle">
            Hearts2Hearts 앨범별 프로모션 일정을 확인하세요.
        </p>

        <div class="album-list" id="albumList"></div>

    </section>

    <!-- 앨범 상세 -->
    <section id="viewer">

        <a href="#" class="back-btn" id="backToList" aria-label="목록으로 돌아가기">←</a>

        <div class="detail-title" id="detailTitle"></div>
        <div class="detail-date" id="detailDate"></div>

        <div class="detail-heading">프로모션 일정</div>

        <div class="image-box" id="imageBox"></div>

    </section>

</div>

<!-- 하단 메뉴 -->
<nav class="bottom-nav" aria-label="주요 메뉴">
    <a href="stream.html">스밍</a>
    <a href="schedule.html">일정</a>
    <a href="index.html" class="active" aria-current="page">홈</a>
    <a href="content.html">콘텐츠</a>
    <a href="archive.html">아카이브</a>
</nav>

<script>
const albums = [
    {
        title: "The Chase",
        date: "2025.02.24",
        images: ["TheChase-scheduler.jpg"]
    },
    {
        title: "STYLE",
        date: "2025.06.18",
        images: ["STYLE-scheduler.jpg"]
    },
    {
        title: "FOCUS",
        date: "2025.10.20",
        images: ["FOCUS-scheduler.jpg"]
    },
    {
        title: "RUDE!",
        date: "2026.02.20",
        images: ["RUDE-scheduler.jpg"]
    },
    {
        title: "Lemon Tang",
        date: "2026.06.22",
        images: ["LemonTang-scheduler.jpg"]
    },
    {
        title: "ICONIC HEART",
        date: "2026.08.12",
        images: ["ICONICHEART-scheduler.png"]
    }
];

const listView = document.getElementById("listView");
const viewer = document.getElementById("viewer");
const albumList = document.getElementById("albumList");
const detailTitle = document.getElementById("detailTitle");
const detailDate = document.getElementById("detailDate");
const imageBox = document.getElementById("imageBox");

function renderList() {
    albumList.innerHTML = "";

    albums.forEach((album, index) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "album-card";
        card.setAttribute("aria-label", album.title + " 프로모션 일정 보기");

        const preview = document.createElement("div");
        preview.className = "album-preview";

        const img = document.createElement("img");
        img.src = album.images[0];
        img.alt = album.title + " 프로모션 미리보기";
        img.loading = "lazy";

        img.addEventListener("error", function () {
            const error = document.createElement("div");
            error.className = "preview-error";
            error.textContent = "이미지를 불러올 수 없습니다.";
            img.replaceWith(error);
        }, { once: true });

        preview.appendChild(img);

        const info = document.createElement("div");
        info.className = "album-info";

        const name = document.createElement("h2");
        name.className = "album-name";
        name.textContent = album.title;

        const date = document.createElement("p");
        date.className = "album-date";
        date.textContent = album.date;

        info.append(name, date);
        card.append(preview, info);

        card.addEventListener("click", () => openAlbum(index));

        albumList.appendChild(card);
    });
}

function openAlbum(index) {
    const album = albums[index];
    if (!album) return;

    detailTitle.textContent = album.title;
    detailDate.textContent = "발매일 · " + album.date;
    imageBox.innerHTML = "";

    album.images.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        img.alt = album.title + " 프로모션 일정";
        img.loading = "lazy";

        img.addEventListener("error", function () {
            const error = document.createElement("div");
            error.className = "image-error";
            error.textContent = "이미지를 불러올 수 없습니다: " + src;
            img.replaceWith(error);
        }, { once: true });

        imageBox.appendChild(img);
    });

    listView.style.display = "none";
    viewer.style.display = "block";

    window.scrollTo(0, 0);
}

function showList() {
    viewer.style.display = "none";
    listView.style.display = "block";

    window.scrollTo(0, 0);
}

document.getElementById("backToList").addEventListener("click", function (event) {
    event.preventDefault();
    showList();
});

renderList();
</script>

</body>
</html>
