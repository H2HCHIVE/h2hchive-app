<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MV | H2HCHIVE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, "Noto Sans KR", sans-serif;
            color: #222;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #777;
            font-size: 13px;
            text-decoration: none;
        }

        .title {
            margin-bottom: 14px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        .page-description {
            margin: -14px 0 24px;
            color: #9298a2;
            font-size: 12px;
            line-height: 1.7;
            word-break: keep-all;
        }

        .mv-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .mv-card {
            overflow: hidden;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }

        .mv-video {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #e9edf1;
        }

        .mv-video iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .mv-name {
            padding: 16px;
            font-size: 15px;
            font-weight: 750;
            letter-spacing: -0.3px;
        }
    </style>
</head>

<body>
